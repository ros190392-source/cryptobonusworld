name: CBW Kazakhstan Country Hub 052C browser review

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [master]

permissions:
  contents: read

jobs:
  browser-review:
    if: github.event.pull_request.head.ref == 'qa/cbw-kazakhstan-country-hub-052c'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/cbw-preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4321/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/cbw-preview.log
          exit 1
      - name: Validate Kazakhstan country-hub preview
        run: |
          mkdir -p qa-artifacts
          cat > .qa-kz-country-hub.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';

          const viewports = [
            { name: 'desktop-1440', width: 1440, height: 1000 },
            { name: 'tablet-768', width: 768, height: 1024 },
            { name: 'mobile-390', width: 390, height: 844 },
          ];
          const results = [];
          let failed = false;
          const browser = await chromium.launch({ headless: true });
          const sitemapResponse = await fetch('http://127.0.0.1:4321/sitemap.xml');
          const sitemapText = await sitemapResponse.text();
          const sitemapExcluded = !sitemapText.includes('/countries/kazakhstan/');

          try {
            for (const viewport of viewports) {
              const page = await browser.newPage({ viewport });
              const consoleErrors = [];
              const pageErrors = [];
              const httpFailures = [];
              page.on('console', message => { if (message.type() === 'error') consoleErrors.push(message.text()); });
              page.on('pageerror', error => pageErrors.push(error.message));
              page.on('response', response => {
                if (response.status() >= 400) httpFailures.push({ status: response.status(), url: response.url() });
              });

              const response = await page.goto('http://127.0.0.1:4321/countries/kazakhstan/', { waitUntil: 'networkidle' });
              const dimensions = await page.evaluate(() => ({
                scrollWidth: document.documentElement.scrollWidth,
                clientWidth: document.documentElement.clientWidth,
                bodyScrollWidth: document.body.scrollWidth,
              }));
              const robots = await page.locator('meta[name="robots"]').getAttribute('content');
              const metrics = await page.locator('.metric-card > strong').allTextContents();
              const flagStates = await page.locator('.flag-list strong').allTextContents();
              const rankingRows = await page.locator('[data-country-preview]').getAttribute('data-ranking-rows');
              const checks = {
                http200: response?.status() === 200,
                noindex: robots === 'noindex, nofollow',
                noCanonical: await page.locator('link[rel="canonical"]').count() === 0,
                sitemapExcluded,
                oneHeader: await page.locator('header.site-header[data-site-header]').count() === 1,
                oneFooter: await page.locator('.site-footer').count() === 1,
                countryIdentity: await page.locator('[data-country-preview="KZ"]').count() === 1,
                metricsExact: JSON.stringify(metrics.map(value => value.trim())) === JSON.stringify(['23', '22', '6', '3']),
                threeProfiles: await page.locator('[data-profile]').count() === 3,
                profileSet: await page.locator('[data-profile="binance"], [data-profile="bybit"], [data-profile="okx"]').count() === 3,
                sixOpenGaps: await page.locator('.gap-card').count() === 6,
                fiveAuthorizationFlags: flagStates.length === 5,
                allFlagsOff: flagStates.every(value => value.trim() === 'OFF'),
                zeroRankingRows: rankingRows === '0' && await page.locator('[data-ranking-row]').count() === 0,
                emptyRankingVisible: await page.locator('[data-ranking-empty]').count() === 1,
                approvedClaimsZero: await page.getByText(/approved claims:\s*0/i).count() === 1,
                noAffiliateLinks: await page.locator('a[href^="/go/"]').count() === 0,
                noLocaleLinks: await page.locator('a[href^="/ru/"], a[href^="/pl/"], a[href^="/uk/"], link[rel="alternate"][hreflang]').count() === 0,
                noOverflow: dimensions.scrollWidth <= dimensions.clientWidth + 1 && dimensions.bodyScrollWidth <= dimensions.clientWidth + 1,
                noConsoleErrors: consoleErrors.length === 0,
                noPageErrors: pageErrors.length === 0,
                noHttpFailures: httpFailures.length === 0,
              };

              const ok = Object.values(checks).every(Boolean);
              failed ||= !ok;
              const result = { viewport, ok, checks, dimensions, consoleErrors, pageErrors, httpFailures };
              results.push(result);
              console.log(JSON.stringify(result, null, 2));
              await page.screenshot({ path: `qa-artifacts/kazakhstan-country-hub-${viewport.name}.png`, fullPage: true });
              await page.close();
            }
          } finally {
            await browser.close();
          }

          await writeFile('qa-artifacts/cbw-kazakhstan-country-hub-052c.json', JSON.stringify({ failed, sitemapExcluded, results }, null, 2));
          if (failed) process.exit(1);
          EOF
          node .qa-kz-country-hub.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbw-kazakhstan-country-hub-052c-review
          path: qa-artifacts/
          if-no-files-found: error
