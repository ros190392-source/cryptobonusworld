name: CBW Contact Utility

on:
  pull_request:
    branches:
      - master
    paths:
      - 'src/pages/contact.astro'
      - 'scripts/ui/contact-utility-browser-smoke.mjs'
      - '.github/workflows/cbw-contact-utility.yml'

permissions:
  contents: read

concurrency:
  group: cbw-contact-utility-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  contact-utility:
    name: Contact utility hard gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Contact utility Chromium
        run: node scripts/ui/contact-utility-browser-smoke.mjs

      - name: Indexability inventory
        run: node scripts/seo/site-indexability-inventory.mjs
