name: CBW Portal Contracts Advisory

# Advisory-only, NON-BLOCKING gate for the Portal Factory contracts + their
# Split-2/Split-3 integration surfaces.
#
# IMPORTANT — this is NOT a required merge gate:
#   * every step runs while prior steps are green, but the job is
#     `continue-on-error: true`, so the JOB conclusion is non-blocking.
#     A reviewer MUST inspect the individual STEP outcomes.
#   * the authoritative local enforcement is the build-time fail-closed fixture
#     throw plus the explicit public-offer / owner-authority regression checks.
#
# Read-only permissions; never deploys and never writes repository contents.

on:
  pull_request:
    paths:
      - 'src/data/contracts/**'
      - 'src/data/homepageTop10.ts'
      - 'src/data/homepageTop10Cta.ts'
      - 'src/data/portalCtaMode.ts'
      - 'src/data/publicOfferView.ts'
      - 'src/data/publicCommercialRoute.ts'
      - 'src/data/offers.ts'
      - 'src/data/evidence/offers/**'
      - 'src/data/exchanges.ts'
      - 'src/data/exchanges.json'
      - 'src/data/exchangePreview/cta-contract.ts'
      - 'src/components/home/**'
      - 'src/components/exchange/**'
      - 'src/components/exchange-preview/**'
      - 'src/components/site-standard/ExchangeDirectoryCard.astro'
      - 'src/components/portal-v2/**'
      - 'src/pages/go/**'
      - 'src/pages/promo-codes/**'
      - 'src/pages/**/portal-contracts/**'
      - 'scripts/portal/**'
      - 'scripts/evidence/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/cbw-portal-contracts-advisory.yml'

permissions:
  contents: read

concurrency:
  group: cbw-portal-contracts-advisory-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  portal-contracts:
    name: Portal contracts advisory (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck portal contracts
        id: typecheck
        run: |
          set -euo pipefail
          node_modules/.bin/tsc --noEmit --strict --skipLibCheck --resolveJsonModule \
            --moduleResolution bundler --module esnext --target es2022 \
            src/data/contracts/internalPath.ts \
            src/data/contracts/portalFactory.ts \
            src/data/contracts/portalUi.ts \
            src/data/contracts/portalRouteGuards.ts \
            src/data/contracts/portalPublication.ts \
            src/data/contracts/portalFoundationFixtures.ts \
            src/data/contracts/portalCta.ts \
            src/data/contracts/portalCtaI18n.ts \
            src/data/contracts/portalDisclosure.ts \
            src/data/contracts/evidenceMetadata.ts \
            src/data/contracts/offerEvidencePacket.ts \
            src/data/contracts/publicRenderedCapture.ts \
            src/data/contracts/claimConfirmation.ts \
            src/data/contracts/offerPacketResolution.ts \
            src/data/contracts/officialSourceCapture.ts \
            src/data/contracts/bybitOfferClaimSourcePlan.ts \
            src/data/contracts/countryInput.ts \
            src/data/contracts/marketProfileRegistry.ts \
            src/data/contracts/countryAwareCta.ts \
            src/data/contracts/portalStateFixtures.ts \
            src/data/homepageTop10Cta.ts \
            src/data/contracts/publicOfferAuthority.ts \
            src/data/contracts/ownerConfirmedCommercialAuthority.ts \
            src/data/publicOfferView.ts \
            src/data/publicCommercialRoute.ts \
            src/data/evidence/offers/bybitPublicPresentation.ts \
            src/data/evidence/offers/bybitOfferEvidence.ts \
            src/data/evidence/offers/bybitPromoCodeConfirmation.ts \
            src/data/exchangePreview/cta-contract.ts

      - name: Owner-confirmed link/code authority split regression
        id: owner_authority_split
        run: node scripts/portal/owner-confirmed-authority-split-test.mjs

      - name: AI-ops fail-closed fixtures
        id: fixtures
        run: npm run ai-ops:validate:fixtures

      - name: Production test-authority guard (AST export-surface + import boundary)
        id: test_authority_guard
        run: npm run portal:guard:test-authority

      - name: Portal contracts fail-closed test
        id: contracts_test
        run: npm run portal:contracts:test

      - name: Offer-packet resolution harness
        id: resolution_harness
        run: npm run portal:harness:resolution

      - name: Preview build (default fail-closed CTA mode)
        id: preview_build
        run: npm run build

      - name: Preview Bybit public-output audit
        id: preview_bybit_audit
        run: npm run portal:audit:bybit-public

      - name: Preview global public-offer audit
        id: preview_public_offers_audit
        run: npm run portal:audit:public-offers

      - name: Preview Chromium owner-authority smoke
        id: preview_browser
        run: node scripts/portal/owner-confirmed-browser-smoke.mjs preview

      - name: Production-simulation build
        id: production_build
        env:
          PUBLIC_CBW_CTA_MODE: production
        run: npm run build

      - name: Production-simulation Bybit public-output audit
        id: production_bybit_audit
        run: npm run portal:audit:bybit-public

      - name: Production-simulation global public-offer audit
        id: production_public_offers_audit
        run: npm run portal:audit:public-offers

      - name: Production Chromium owner-authority smoke
        id: production_browser
        run: node scripts/portal/owner-confirmed-browser-smoke.mjs production

      - name: Advisory summary
        if: always()
        env:
          TYPECHECK: ${{ steps.typecheck.outcome }}
          OWNER_AUTHORITY_SPLIT: ${{ steps.owner_authority_split.outcome }}
          FIXTURES: ${{ steps.fixtures.outcome }}
          GUARD: ${{ steps.test_authority_guard.outcome }}
          CONTRACTS_TEST: ${{ steps.contracts_test.outcome }}
          RESOLUTION_HARNESS: ${{ steps.resolution_harness.outcome }}
          PREVIEW_BUILD: ${{ steps.preview_build.outcome }}
          PREVIEW_BYBIT_AUDIT: ${{ steps.preview_bybit_audit.outcome }}
          PREVIEW_PUBLIC_OFFERS_AUDIT: ${{ steps.preview_public_offers_audit.outcome }}
          PREVIEW_BROWSER: ${{ steps.preview_browser.outcome }}
          PRODUCTION_BUILD: ${{ steps.production_build.outcome }}
          PRODUCTION_BYBIT_AUDIT: ${{ steps.production_bybit_audit.outcome }}
          PRODUCTION_PUBLIC_OFFERS_AUDIT: ${{ steps.production_public_offers_audit.outcome }}
          PRODUCTION_BROWSER: ${{ steps.production_browser.outcome }}
        run: |
          {
            echo "### Portal Contracts Advisory (non-blocking)"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Contracts typecheck | ${TYPECHECK} |"
            echo "| Owner link/code authority split regression | ${OWNER_AUTHORITY_SPLIT} |"
            echo "| Fail-closed fixtures | ${FIXTURES} |"
            echo "| Test-authority guard | ${GUARD} |"
            echo "| Contracts fail-closed test | ${CONTRACTS_TEST} |"
            echo "| Offer-packet resolution harness | ${RESOLUTION_HARNESS} |"
            echo "| Preview build | ${PREVIEW_BUILD} |"
            echo "| Preview Bybit public-output audit | ${PREVIEW_BYBIT_AUDIT} |"
            echo "| Preview global public-offer audit | ${PREVIEW_PUBLIC_OFFERS_AUDIT} |"
            echo "| Preview Chromium smoke | ${PREVIEW_BROWSER} |"
            echo "| Production-simulation build | ${PRODUCTION_BUILD} |"
            echo "| Production Bybit public-output audit | ${PRODUCTION_BYBIT_AUDIT} |"
            echo "| Production global public-offer audit | ${PRODUCTION_PUBLIC_OFFERS_AUDIT} |"
            echo "| Production Chromium smoke | ${PRODUCTION_BROWSER} |"
            echo ""
            echo "> **Advisory only — not a required merge gate.** This job is \`continue-on-error\`, so its"
            echo "> conclusion is non-blocking; inspect every individual step result before owner merge."
          } >> "$GITHUB_STEP_SUMMARY"
