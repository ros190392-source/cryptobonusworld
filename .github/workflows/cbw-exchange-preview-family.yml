name: CBW Exchange Preview Family

on:
  pull_request:
    branches:
      - master
    paths:
      - 'src/pages/preview/exchanges/**'
      - 'src/components/exchange-preview/**'
      - 'src/data/exchangePreview/**'
      - 'scripts/ui/exchange-preview-family-browser-smoke.mjs'
      - '.github/workflows/cbw-exchange-preview-family.yml'

permissions:
  contents: read

concurrency:
  group: cbw-exchange-preview-family-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  exchange-preview-family:
    name: Exchange preview family hard gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Production build
        id: build
        run: npm run build

      - name: Exchange preview family Chromium
        id: browser
        run: node scripts/ui/exchange-preview-family-browser-smoke.mjs

      - name: Indexability inventory
        id: indexability
        if: always() && steps.build.outcome == 'success'
        run: node scripts/seo/site-indexability-inventory.mjs

      - name: Summary
        if: always()
        env:
          BUILD: ${{ steps.build.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
          INDEXABILITY: ${{ steps.indexability.outcome }}
        run: |
          {
            echo '### CBW Exchange Preview Family Hard Gate'
            echo ''
            echo '| Check | Result |'
            echo '|---|---|'
            echo "| Production build | ${BUILD} |"
            echo "| 20-route desktop/mobile Chromium | ${BROWSER} |"
            echo "| Indexability inventory | ${INDEXABILITY} |"
            echo ''
            echo '> Hard owner-preview gate. It never authorizes publication, indexing, ranking or affiliate actions.'
          } >> "$GITHUB_STEP_SUMMARY"
