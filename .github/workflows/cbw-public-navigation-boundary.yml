name: CBW Public Navigation Boundary

on:
  pull_request:
    branches:
      - master
    paths:
      - 'src/pages/**'
      - 'src/layouts/**'
      - 'src/components/**'
      - 'scripts/seo/public-navigation-boundary-test.mjs'
      - '.github/workflows/cbw-public-navigation-boundary.yml'

permissions:
  contents: read

concurrency:
  group: cbw-public-navigation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  public-navigation:
    name: Public navigation hard gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Public navigation boundary
        run: node scripts/seo/public-navigation-boundary-test.mjs
