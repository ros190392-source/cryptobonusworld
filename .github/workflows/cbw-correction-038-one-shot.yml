name: CBW Correction 038 one-shot

on:
  pull_request:
    types: [opened, reopened]
    branches:
      - main

permissions:
  contents: write

jobs:
  correction-038:
    if: github.event.pull_request.head.ref == 'research/kz-binance-kz-p0-d-correction-worker-probe'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout worker branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Generate corrected package
        run: |
          set -euo pipefail
          python .github/cbw-correction-038.py
          python - <<'PY'
          from pathlib import Path
          p = Path('research-ops/tasks/CBW-KZ-BINANCE-P0-D-DEEP-RESEARCH-001/60-correction/20-corrected-output/source-truth-review-report.md')
          p.write_text(p.read_text(encoding='utf-8').rstrip('\n') + '\n', encoding='utf-8', newline='\n')
          PY

      - name: Validate Factory state and package
        run: |
          set -euo pipefail
          TASK="research-ops/tasks/CBW-KZ-BINANCE-P0-D-DEEP-RESEARCH-001"
          node research-ops/factory-v1-1/bin/researchops.mjs validate --task-dir "$TASK" --require-package
          git diff --check

      - name: Commit correction output
        run: |
          set -euo pipefail
          TASK="research-ops/tasks/CBW-KZ-BINANCE-P0-D-DEEP-RESEARCH-001"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TASK"
          git diff --cached --check
          git commit -m "research(kz-binance): apply correction 038"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
