name: CBW Apply Final Site Standard Remediation 053G R1

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [master]

permissions:
  contents: write

jobs:
  apply-remediation:
    if: github.event.pull_request.head.ref == 'fix/cbw-final-site-standard-exceptions-053g-r1'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Apply exact source remediation
        run: node scripts/audits/apply-final-remediation-053g-r1.mjs
      - name: Validate source diff
        run: |
          git diff --check
          git diff -- src/pages/affiliate-disclosure.astro src/pages/editorial-policy.astro src/pages/update-policy.astro src/pages/methodology.astro src/pages/countries/kazakhstan/index.astro
      - name: Production build
        run: npm run build
      - name: Affiliate integrity
        run: npm run validate:affiliate
      - name: SEO integrity
        run: npm run seo:check
      - name: Commit clean product-only remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/affiliate-disclosure.astro src/pages/editorial-policy.astro src/pages/update-policy.astro src/pages/methodology.astro src/pages/countries/kazakhstan/index.astro
          git rm .github/workflows/cbw-apply-final-remediation-053g-r1.yml scripts/audits/apply-final-remediation-053g-r1.mjs
          git commit -m "fix: align final Site Standard width and first-screen exceptions"
          git push origin HEAD:${{ github.head_ref }}
