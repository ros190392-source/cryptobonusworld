name: CBW Remaining Page Families v2 052I representative review R2

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [master]

permissions:
  contents: read

jobs:
  browser-review:
    if: github.event.pull_request.head.ref == 'qa/cbw-remaining-page-families-v2-052i-representative-r2'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/cbw-preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4321/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/cbw-preview.log
          exit 1
      - name: Validate representative page families
        run: |
          mkdir -p qa-artifacts
          cat > .qa-remaining-families-representative-r2.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';

          const routes = [
            ['exchanges', '/exchanges/', 'directory'],
            ['promo-codes', '/promo-codes/', 'promo'],
            ['methodology', '/methodology/', 'methodology'],
            ['affiliate-disclosure', '/affiliate-disclosure/', 'legal'],
          ];
          const viewports = [
            ['desktop-1440', 1440, 1000],
            ['tablet-768', 768, 1024],
            ['mobile-390', 390, 844],
          ];
          const results = [];
          let failed = false;
          const browser = await chromium.launch({ headless: true });

          try {
            for (const [name, path, family] of routes) {
              for (const [viewportName, width, height] of viewports) {
                const page = await browser.newPage({ viewport: { width, height } });
                const consoleErrors = [];
                const pageErrors = [];
                const httpFailures = [];
                page.on('console', message => { if (message.type() === 'error') consoleErrors.push(message.text()); });
                page.on('pageerror', error => pageErrors.push(error.message));
                page.on('response', response => {
                  if (response.status() >= 400) httpFailures.push({ status: response.status(), url: response.url() });
                });

                const response = await page.goto(`http://127.0.0.1:4321${path}`, { waitUntil: 'networkidle' });
                const dimensions = await page.evaluate(() => ({
                  scrollWidth: document.documentElement.scrollWidth,
                  clientWidth: document.documentElement.clientWidth,
                  bodyScrollWidth: document.body.scrollWidth,
                }));
                const checks = {
                  http200: response?.status() === 200,
                  oneHeader: await page.locator('.site-header').count() === 1,
                  oneFooter: await page.locator('.site-footer').count() === 1,
                  noFinderLinks: await page.locator('a[href="/#finder"]').count() === 0,
                  noOverflow: dimensions.scrollWidth <= dimensions.clientWidth + 1 && dimensions.bodyScrollWidth <= dimensions.clientWidth + 1,
                  noConsoleErrors: consoleErrors.length === 0,
                  noPageErrors: pageErrors.length === 0,
                  noHttpFailures: httpFailures.length === 0,
                };

                if (family !== 'legal') {
                  const title = page.locator('.page-hero .ph-title').first();
                  const style = await title.evaluate(element => ({
                    family: getComputedStyle(element).fontFamily,
                    size: parseFloat(getComputedStyle(element).fontSize),
                    color: getComputedStyle(element).color,
                  }));
                  checks.pageHeroPresent = await page.locator('.page-hero').count() === 1;
                  checks.heroBarlow = style.family.includes('Barlow Condensed');
                  checks.heroWhite = style.color === 'rgb(255, 255, 255)';
                  checks.heroSize = style.size >= 38;
                }

                if (family === 'directory') {
                  const cards = page.locator('.ec');
                  checks.sixCards = await cards.count() === 6;
                  checks.sixAffiliateCtas = await page.locator('.ec-cta[href^="/go/"]').count() === 6;
                  checks.cardRadius = await cards.first().evaluate(element => parseFloat(getComputedStyle(element).borderRadius)) >= 16;
                  checks.cardCtaAmber = await page.locator('.ec-cta').first().evaluate(element => getComputedStyle(element).backgroundColor) === 'rgb(247, 147, 26)';
                  checks.sixFaqs = await page.locator('.exd-faq-item').count() === 6;
                }

                if (family === 'promo') {
                  const countryLink = page.locator('.pc-country-link');
                  checks.sixRows = await page.locator('[data-pc-row]').count() === 6;
                  checks.sixClaimPaths = await page.locator('.pc-claim-btn[href^="/go/"]').count() === 6;
                  checks.claimAmber = await page.locator('.pc-claim-btn').first().evaluate(element => getComputedStyle(element).backgroundColor) === 'rgb(247, 147, 26)';
                  checks.tableRadius = await page.locator('.pc-table-scroll').evaluate(element => parseFloat(getComputedStyle(element).borderRadius)) >= (width <= 760 ? 0 : 15);
                  checks.countryLinkPresent = await countryLink.count() === 1;
                  checks.normalizedText = (await countryLink.textContent())?.trim() === 'Compare the Top 10 →';
                  checks.normalizedHref = await countryLink.getAttribute('href') === '/#exchanges';
                  checks.eightFaqs = await page.locator('.pc-faq-item').count() === 8;
                }

                if (family === 'methodology') {
                  checks.sixSteps = await page.locator('.mth-step').count() === 6;
                  checks.sixCriteria = await page.locator('.mth-criterion').count() === 6;
                  checks.stepRadius = await page.locator('.mth-step').first().evaluate(element => parseFloat(getComputedStyle(element).borderRadius)) >= 14;
                  const heading = page.locator('.mth-section-head h2').first();
                  checks.headingBarlow = await heading.evaluate(element => getComputedStyle(element).fontFamily.includes('Barlow Condensed'));
                  checks.headingNavy = await heading.evaluate(element => getComputedStyle(element).color === 'rgb(19, 35, 62)');
                }

                if (family === 'legal') {
                  const heading = page.locator('.ad-h1');
                  checks.proseSurface = await page.locator('.ad-prose').count() === 1;
                  checks.proseRadius = await page.locator('.ad-prose').evaluate(element => parseFloat(getComputedStyle(element).borderRadius)) >= 15;
                  checks.headingBarlow = await heading.evaluate(element => getComputedStyle(element).fontFamily.includes('Barlow Condensed'));
                  checks.headingNavy = await heading.evaluate(element => getComputedStyle(element).color === 'rgb(19, 35, 62)');
                  checks.twoCallouts = await page.locator('.ad-callout').count() === 2;
                }

                const ok = Object.values(checks).every(Boolean);
                failed ||= !ok;
                const result = { name, path, family, viewportName, width, height, ok, checks, dimensions, consoleErrors, pageErrors, httpFailures };
                results.push(result);
                console.log(JSON.stringify(result, null, 2));
                await page.screenshot({ path: `qa-artifacts/${name}-${viewportName}.png`, fullPage: true });
                await page.close();
              }
            }
          } finally {
            await browser.close();
          }

          await writeFile('qa-artifacts/cbw-remaining-page-families-v2-052i-representative-r2.json', JSON.stringify({ failed, results }, null, 2));
          if (failed) process.exit(1);
          EOF
          node .qa-remaining-families-representative-r2.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbw-remaining-page-families-v2-052i-representative-r2
          path: qa-artifacts/
          if-no-files-found: error
