name: CBW ResearchOps Factory validate (advisory, read-only)

# Read-only, FAIL-CLOSED PR validation for the ResearchOps Subscription Factory.
# Runs only the direct Node CLI/test runner. Never merges, never deploys,
# never creates issues/branches/PRs, never calls an AI provider, never touches master.

on:
  pull_request:
    paths:
      - 'research-ops/**'
      - '.github/workflows/cbw-researchops-factory-validate.yml'

permissions:
  contents: read

concurrency:
  group: researchops-factory-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (read-only)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax-check factory sources
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            node --check "$f" || fail=1
          done < <(find research-ops/factory-v1-1 -type f -name '*.mjs' | sort)
          exit $fail

      - name: Run factory fixtures
        run: node research-ops/factory-v1-1/fixtures/run.mjs

      - name: Discover changed files and trusted event metadata (fail-closed)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          # C3/V2-C3 — trusted base/head SHAs AND head/base branch refs come from the
          # GitHub event context, never from repository files. Any missing/inconsistent
          # value fails the job (fail-closed).
          [ -n "$BASE_SHA" ] || { echo "empty base sha"; exit 1; }
          [ -n "$HEAD_SHA" ] || { echo "empty head sha"; exit 1; }
          [ -n "$HEAD_BRANCH" ] || { echo "empty head branch"; exit 1; }
          [ -n "$BASE_BRANCH" ] || { echo "empty base branch"; exit 1; }
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          # V4-C7 — checkout/event/workspace integrity, fail-closed.
          [ "$(git rev-parse --is-shallow-repository)" = "false" ] || { echo "shallow repository"; exit 1; }
          [ "$(git rev-parse HEAD)" = "$HEAD_SHA" ] || { echo "checked-out HEAD != trusted head sha"; exit 1; }
          [ "$(git rev-parse --show-toplevel)" = "$GITHUB_WORKSPACE" ] || { echo "workspace != resolved worktree root"; exit 1; }
          git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA" || { echo "head does not descend approved base"; exit 1; }
          # C3 — no `|| true`; a diff failure fails the job.
          # V3-C10 — NUL-delimited, unquoted name-status: unambiguous for paths with
          # tabs/newlines/quotes and immune to core.quotePath escaping.
          git -c core.quotePath=false diff -z --name-status "$BASE_SHA" "$HEAD_SHA" > changed-status.z
          {
            echo "BASE_SHA=$BASE_SHA"; echo "HEAD_SHA=$HEAD_SHA"
            echo "HEAD_BRANCH=$HEAD_BRANCH"; echo "BASE_BRANCH=$BASE_BRANCH"
          } >> "$GITHUB_ENV"
          echo "Changed (name-status, human view):"
          git --no-pager diff --name-status "$BASE_SHA" "$HEAD_SHA" || true

      - name: Prepare TRUSTED-BASE enforcement root (V4-C2)
        run: |
          set -euo pipefail
          # V4-C2 — the enforcement validator is executed from the PROTECTED BASE copy of
          # the factory code, NEVER the PR head. A PR that weakens boundary/lineage/roles
          # or the workflow in its own head therefore cannot validate itself: the base
          # (prior trusted policy) evaluates the head diff as data. Policy changes are thus
          # gated by the prior policy and an implementation/correction-role governed record.
          git worktree add --detach ../trusted-base "$BASE_SHA"

      - name: Enforce append-only boundary from the trusted base (fail-closed)
        run: |
          set -euo pipefail
          # Run the BASE validator (../trusted-base) against the head diff + trusted event
          # metadata and checkout facts. V4 adds role capability, owner governed-record
          # authorization, commit ancestry and event/workspace integrity.
          node ../trusted-base/research-ops/factory-v1-1/bin/researchops.mjs check-boundary \
            --changed-status-z changed-status.z \
            --emit-task-roots task-roots.txt \
            --head-branch "$HEAD_BRANCH" \
            --base-branch "$BASE_BRANCH" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --checked-out-head "$(git rev-parse HEAD)" \
            --workspace "$GITHUB_WORKSPACE" \
            --repo-root "$GITHUB_WORKSPACE"

      - name: Validate discovered task roots (fail-closed)
        run: |
          set -euo pipefail
          if [ -s task-roots.txt ]; then
            while IFS= read -r t; do
              [ -n "$t" ] || continue
              # C4 — a referenced-but-absent root fails the job.
              [ -d "$t" ] || { echo "task root missing: $t"; exit 1; }
              echo "::group::validate $t"
              node research-ops/factory-v1-1/bin/researchops.mjs validate --task-dir "$t"
              echo "::endgroup::"
            done < task-roots.txt
          else
            echo "Factory-governance PR: no research-task root to validate."
          fi

      - name: Step summary
        if: always()
        run: |
          {
            echo "# ResearchOps Factory validation"
            echo ""
            echo "- Node: 20"
            echo "- Fixtures: executed via \`node research-ops/factory-v1-1/fixtures/run.mjs\`"
            echo "- Boundary: enforced via \`researchops check-boundary\` (fail-closed)"
            echo "- Permissions: contents:read (read-only)"
            echo "- Merges/deploys/AI calls/master mutation: none"
          } >> "$GITHUB_STEP_SUMMARY"
