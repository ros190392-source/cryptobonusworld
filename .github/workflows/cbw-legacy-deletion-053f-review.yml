name: CBW Legacy Layer Deletion 053F Review

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [master]

permissions:
  contents: read

jobs:
  deletion-review:
    if: github.event.pull_request.head.ref == 'qa/cbw-remove-legacy-site-layers-053f'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run fail-closed legacy deletion audit
        run: node scripts/audits/legacy-site-layer-audit.mjs
      - run: npm run build
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/cbw-preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4321/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/cbw-preview.log
          exit 1
      - name: Run browser and redirect parity
        run: node qa/legacy-deletion-053f.mjs
      - name: Upload deletion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbw-legacy-deletion-053f-review
          path: |
            qa-artifacts/
            reports/site-standard/CBW_LEGACY_LAYER_AUDIT_053F.json
            reports/site-standard/CBW_LEGACY_LAYER_AUDIT_053F.md
          if-no-files-found: error
          retention-days: 90
