name: CBW Master Required Gate

# Single stable, ALWAYS-REPORTING required check context for product branch
# `master` (issue #366).
#
# STAGE 2 / S2-04 BATCH 02. The single-job gate delivered by S2-01 became a
# bounded multi-job DAG in S2-03; batch 01 widened that DAG from two blockers to
# four, and this batch widens it to six, adding NO new mechanism:
#
#     classify
#        |-> contact-utility --------------|
#        |-> exchange-preview-family ------|
#        |-> global-header-interaction ----|
#        |-> public-first-screen-budget ---|
#        |-> public-navigation ------------|
#        |-> public-seo-metadata ----------|--> Master required gate (if: always())
#
# The visible check context of the FINAL job is exactly "Master required gate"
# and nothing else in this repository may claim that name. Branch protection —
# when it is eventually enabled, which is NOT this stage — names that one string.
# It must never name a path-filtered child workflow, because a workflow that does
# not run on every PR deadlocks a required status on
# "Expected — Waiting for status to be reported".
#
# THIS WORKFLOW OWNS ITS OWN EXECUTION AND ITS OWN OUTCOMES. It never queries the
# status of another workflow. The specialized path-filtered workflows
# (.github/workflows/cbw-global-header-interaction.yml,
#  .github/workflows/cbw-public-seo-metadata.yml,
#  .github/workflows/cbw-public-navigation-boundary.yml,
#  .github/workflows/cbw-public-first-screen-budget.yml,
#  .github/workflows/cbw-contact-utility.yml,
#  .github/workflows/cbw-exchange-preview-family.yml) are deliberately left
# UNCHANGED — byte-identical — and continue to report independently; this stage
# proves unified execution parity before legacy retirement is even considered.
# Nothing here deletes, disables or weakens them.
#
# THE EXCHANGE PREVIEW FAMILY BLOCKER IS OWNER-PREVIEW ONLY. Executing it inside
# the required context grants it no publication, indexing, ranking or affiliate
# authority; it proves the owner's preview routes still render and still stay out
# of the index, exactly as the legacy gate did.
#
# Design contract — enforced by scripts/ci/master-required-gate-contract-test.mjs
# and exercised against deliberate mutations by
# scripts/ci/master-required-gate-mutation-test.mjs:
#   * NO `paths` / `paths-ignore` filter, so the context is always reported.
#   * Exactly ONE job whose visible name is "Master required gate", and that job
#     is the FINAL aggregator. It carries `if: always()`, depends on the
#     classifier AND on every registered blocker, and is never
#     `continue-on-error`.
#   * The aggregator succeeds ONLY when every expected blocker is provably PASS or
#     provably, evidentially NOT_APPLICABLE. A skipped blocker is NEVER accepted
#     as a pass: `skipped` is what GitHub also reports for an upstream failure, a
#     cancelled run, and an `if` that silently resolved to the empty string.
#   * The classification PRODUCERS are bound by contract. `classify` emits
#     materiality; `applicability` emits the per-blocker decision. Each is
#     followed IMMEDIATELY by an UNCONDITIONAL validator step that fails the job
#     closed on a missing, malformed, contradictory or stale output, because a
#     missing step output silently evaluates false and would skip real blocking
#     work while still reporting SUCCESS. Both producers write a sidecar into
#     RUNNER_TEMP with NO process-global temp fallback, stamped with this run's
#     identity (PR head SHA + run id + run attempt), so a stale file cannot stand
#     in for a producer that never executed.
#   * Change classification stays fail-closed by construction: a path is
#     non-material ONLY if listed verbatim in NON_MATERIAL_PATHS, and irrelevant
#     to a blocker ONLY if listed verbatim in that blocker's `irrelevantPaths`
#     (scripts/ci/master-required-gate-gates.mjs). Everything else — including
#     every unknown/new path — is MATERIAL and RELEVANT, as is an unresolvable or
#     empty change set. Rename detection is disabled so a material source renamed
#     to a non-material destination cannot hide.
#   * Read-only permissions; never deploys and never writes repository contents.
#
# PERFORMANCE. Every blocker installs and builds independently. That duplication
# is deliberate: correctness first. Cross-job artifact reuse is a future
# optimisation and is not introduced here, because it would add a failure mode
# (a stale or partial artifact silently satisfying a gate) that this stage exists
# to rule out.

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: cbw-master-required-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # --- 1. classification -------------------------------------------------------
  # Runs the gate's own self-proving suites unconditionally, then produces the two
  # validated classification statements every downstream job depends on.
  classify:
    name: Master gate classification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      material: ${{ steps.classify.outputs.material }}
      reason: ${{ steps.classify.outputs.reason }}
      applicability: ${{ steps.applicability.outputs.applicability }}
      digest: ${{ steps.applicability.outputs.digest }}
      gate_contact_utility: ${{ steps.applicability.outputs.gate_contact_utility }}
      gate_exchange_preview_family: ${{ steps.applicability.outputs.gate_exchange_preview_family }}
      gate_global_header_interaction: ${{ steps.applicability.outputs.gate_global_header_interaction }}
      gate_public_first_screen_budget: ${{ steps.applicability.outputs.gate_public_first_screen_budget }}
      gate_public_navigation: ${{ steps.applicability.outputs.gate_public_navigation }}
      gate_public_seo_metadata: ${{ steps.applicability.outputs.gate_public_seo_metadata }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Required gate contract self-test
        run: node scripts/ci/master-required-gate-contract-test.mjs

      - name: Classifier real-git fixture suite
        run: node scripts/ci/master-required-gate-classifier-fixture-test.mjs

      - name: Producer/output mutation suite
        run: node scripts/ci/master-required-gate-mutation-test.mjs

      - name: Legacy/unified parity suite
        run: node scripts/ci/master-required-gate-parity-test.mjs

      # Workflow-level proof that every blocker's result emitter really does
      # instantiate and publish after a failed build or a failed gate script.
      - name: Blocker result emitter behaviour suite
        run: node scripts/ci/master-required-gate-emitter-behaviour-test.mjs

      - name: Classify changed files (fail-closed)
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/master-required-gate-classify.mjs --emit-github-output

      # UNCONDITIONAL — no `if`. `steps.classify.outputs.material` resolves to the
      # empty string if the producer above is deleted or its id renamed, and
      # `'' == 'true'` is false, so every downstream consumer would treat the
      # change set as non-material while this job still reported SUCCESS. This
      # step fails the gate closed unless the producer emitted an exactly-valid
      # output that matches its own run-identity-stamped sidecar.
      - name: Validate classifier output
        id: validate
        env:
          CLASSIFIER_MATERIAL: ${{ steps.classify.outputs.material }}
          CLASSIFIER_REASON: ${{ steps.classify.outputs.reason }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/master-required-gate-validate-output.mjs

      - name: Decide blocker applicability (fail-closed)
        id: applicability
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/master-required-gate-applicability.mjs --emit-github-output

      # UNCONDITIONAL — the same fail-open shape one level up. A deleted or
      # renamed applicability producer makes every
      # `needs.classify.outputs.gate_* == 'APPLICABLE'` expression false, which
      # would skip every blocker's real work under a SUCCESS conclusion. This step
      # rejects a missing, malformed, contradictory or stale decision, and proves
      # the decision is consistent with the materiality classification above.
      - name: Validate blocker applicability
        id: validate-applicability
        env:
          APPLICABILITY_JSON: ${{ steps.applicability.outputs.applicability }}
          APPLICABILITY_DIGEST: ${{ steps.applicability.outputs.digest }}
          GATE_CONTACT_UTILITY_APPLICABILITY: ${{ steps.applicability.outputs.gate_contact_utility }}
          GATE_EXCHANGE_PREVIEW_FAMILY_APPLICABILITY: ${{ steps.applicability.outputs.gate_exchange_preview_family }}
          GATE_GLOBAL_HEADER_INTERACTION_APPLICABILITY: ${{ steps.applicability.outputs.gate_global_header_interaction }}
          GATE_PUBLIC_FIRST_SCREEN_BUDGET_APPLICABILITY: ${{ steps.applicability.outputs.gate_public_first_screen_budget }}
          GATE_PUBLIC_NAVIGATION_APPLICABILITY: ${{ steps.applicability.outputs.gate_public_navigation }}
          GATE_PUBLIC_SEO_METADATA_APPLICABILITY: ${{ steps.applicability.outputs.gate_public_seo_metadata }}
          CLASSIFIER_MATERIAL: ${{ steps.classify.outputs.material }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/master-required-gate-validate-applicability.mjs

  # --- 2a. blocker: Global Header Interaction ----------------------------------
  # Migrated from .github/workflows/cbw-global-header-interaction.yml, which stays
  # in place and keeps reporting independently. The command sequence here is
  # proved command-for-command equivalent to the legacy job by
  # scripts/ci/master-required-gate-parity-test.mjs.
  #
  # NO job-level `if`. The job ALWAYS instantiates so it can publish a
  # deterministic outcome; irrelevance is expressed as a published, evidence-
  # backed NOT_APPLICABLE, never as a GitHub `skipped` conclusion.
  global-header-interaction:
    name: Global header interaction (unified blocker)
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      result: ${{ steps.gate-result.outputs.result }}
      evidence: ${{ steps.gate-result.outputs.evidence }}
    steps:
      - name: Checkout exact PR head for the global header blocker
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node 20 for the global header blocker
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies for the global header blocker
        id: install
        if: needs.classify.outputs.gate_global_header_interaction == 'APPLICABLE'
        run: npm ci

      - name: Production build for the global header blocker
        id: build
        if: needs.classify.outputs.gate_global_header_interaction == 'APPLICABLE'
        run: npm run build

      - name: Global header interaction matrix
        id: smoke
        if: needs.classify.outputs.gate_global_header_interaction == 'APPLICABLE'
        run: node scripts/ui/global-header-interaction-browser-smoke.mjs

      # The legacy job guards this step with `always() && steps.build.outcome ==
      # 'success'` so the inventory still runs (and can still fail the job) when
      # the interaction matrix above failed. That exact condition is preserved
      # here, conjoined with applicability, so the unified job's red/green
      # behaviour is identical to the legacy job's in every reachable state
      # rather than merely equivalent in the common one.
      - name: Indexability inventory for the global header blocker
        id: indexability
        if: always() && needs.classify.outputs.gate_global_header_interaction == 'APPLICABLE' && steps.build.outcome == 'success'
        run: node scripts/seo/site-indexability-inventory.mjs

      # `if: always()` — LOAD-BEARING, and the ONLY correct condition here.
      #
      # A step with no `if` carries GitHub's implicit `if: success()`, so it is
      # SKIPPED once any earlier step in the job has failed. That is precisely the
      # state this emitter exists to describe: a failed build or a failed hard-gate
      # script would have skipped the emitter, the job would have published NO
      # result at all, and the closed-result contract ("every blocker publishes
      # exactly one of PASS / NOT_APPLICABLE / FAIL") would be violated in the one
      # case it matters most. `always()` makes the emitter instantiate after
      # failure, cancellation and skip alike.
      #
      # This does NOT soften the job. The emitter EXITS NON-ZERO when it publishes
      # FAIL, so a failed blocking step still makes this blocker job red; the
      # emitter is evidence publication, never failure suppression.
      #
      # Converts what this job ACTUALLY did into the closed outcome vocabulary. It
      # refuses to publish PASS unless every blocking step above reported
      # `success`, and refuses to publish NOT_APPLICABLE unless every one reported
      # `skipped` — so a job cannot claim work it skipped, and cannot claim
      # irrelevance while having run.
      - name: Publish global header blocker result
        id: gate-result
        if: always()
        env:
          GATE_ID: global-header-interaction
          GATE_APPLICABILITY: ${{ needs.classify.outputs.gate_global_header_interaction }}
          APPLICABILITY_DIGEST: ${{ needs.classify.outputs.digest }}
          STEP_OUTCOMES: >-
            [{"name":"npm ci","outcome":"${{ steps.install.outcome }}"},
            {"name":"npm run build","outcome":"${{ steps.build.outcome }}"},
            {"name":"node scripts/ui/global-header-interaction-browser-smoke.mjs","outcome":"${{ steps.smoke.outcome }}"},
            {"name":"node scripts/seo/site-indexability-inventory.mjs","outcome":"${{ steps.indexability.outcome }}"}]
        run: node scripts/ci/master-required-gate-gate-result.mjs

  # --- 2b. blocker: Public SEO Metadata ----------------------------------------
  # Migrated from .github/workflows/cbw-public-seo-metadata.yml, which stays in
  # place and keeps reporting independently.
  public-seo-metadata:
    name: Public SEO metadata (unified blocker)
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      result: ${{ steps.gate-result.outputs.result }}
      evidence: ${{ steps.gate-result.outputs.evidence }}
    steps:
      - name: Checkout exact PR head for the public SEO blocker
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node 20 for the public SEO blocker
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies for the public SEO blocker
        id: install
        if: needs.classify.outputs.gate_public_seo_metadata == 'APPLICABLE'
        run: npm ci

      - name: Production build for the public SEO blocker
        id: build
        if: needs.classify.outputs.gate_public_seo_metadata == 'APPLICABLE'
        run: npm run build

      - name: Public SEO metadata and schema
        id: schema
        if: needs.classify.outputs.gate_public_seo_metadata == 'APPLICABLE'
        run: node scripts/seo/public-seo-metadata-schema-test.mjs

      # Same legacy condition preserved verbatim, conjoined with applicability.
      - name: Indexability inventory for the public SEO blocker
        id: indexability
        if: always() && needs.classify.outputs.gate_public_seo_metadata == 'APPLICABLE' && steps.build.outcome == 'success'
        run: node scripts/seo/site-indexability-inventory.mjs

      # `if: always()` for the reason spelled out on the global-header emitter: an
      # emitter carrying GitHub's implicit `success()` is skipped after a failed
      # build or gate script and publishes nothing at all.
      - name: Publish public SEO blocker result
        id: gate-result
        if: always()
        env:
          GATE_ID: public-seo-metadata
          GATE_APPLICABILITY: ${{ needs.classify.outputs.gate_public_seo_metadata }}
          APPLICABILITY_DIGEST: ${{ needs.classify.outputs.digest }}
          STEP_OUTCOMES: >-
            [{"name":"npm ci","outcome":"${{ steps.install.outcome }}"},
            {"name":"npm run build","outcome":"${{ steps.build.outcome }}"},
            {"name":"node scripts/seo/public-seo-metadata-schema-test.mjs","outcome":"${{ steps.schema.outcome }}"},
            {"name":"node scripts/seo/site-indexability-inventory.mjs","outcome":"${{ steps.indexability.outcome }}"}]
        run: node scripts/ci/master-required-gate-gate-result.mjs

  # --- 2c. blocker: Public Navigation Boundary ---------------------------------
  # Migrated by S2-04 from .github/workflows/cbw-public-navigation-boundary.yml,
  # which stays BYTE-IDENTICAL and keeps reporting independently. The legacy job
  # has no `if`-guarded step, so this blocker's sequence is three plain steps
  # gated purely on applicability; the parity suite proves the red/green
  # behaviour matches over the full failure cross-product.
  public-navigation:
    name: Public navigation boundary (unified blocker)
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      result: ${{ steps.gate-result.outputs.result }}
      evidence: ${{ steps.gate-result.outputs.evidence }}
    steps:
      - name: Checkout exact PR head for the public navigation blocker
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node 20 for the public navigation blocker
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies for the public navigation blocker
        id: install
        if: needs.classify.outputs.gate_public_navigation == 'APPLICABLE'
        run: npm ci

      - name: Production build for the public navigation blocker
        id: build
        if: needs.classify.outputs.gate_public_navigation == 'APPLICABLE'
        run: npm run build

      - name: Public navigation boundary
        id: navigation
        if: needs.classify.outputs.gate_public_navigation == 'APPLICABLE'
        run: node scripts/seo/public-navigation-boundary-test.mjs

      # `if: always()` — see the global-header emitter for the full rationale.
      - name: Publish public navigation blocker result
        id: gate-result
        if: always()
        env:
          GATE_ID: public-navigation
          GATE_APPLICABILITY: ${{ needs.classify.outputs.gate_public_navigation }}
          APPLICABILITY_DIGEST: ${{ needs.classify.outputs.digest }}
          STEP_OUTCOMES: >-
            [{"name":"npm ci","outcome":"${{ steps.install.outcome }}"},
            {"name":"npm run build","outcome":"${{ steps.build.outcome }}"},
            {"name":"node scripts/seo/public-navigation-boundary-test.mjs","outcome":"${{ steps.navigation.outcome }}"}]
        run: node scripts/ci/master-required-gate-gate-result.mjs

  # --- 2d. blocker: Public First Screen Budget ---------------------------------
  # Migrated by S2-04 from
  # .github/workflows/cbw-public-first-screen-budget.yml, which stays
  # BYTE-IDENTICAL and keeps reporting independently.
  public-first-screen-budget:
    name: Public first-screen budget (unified blocker)
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      result: ${{ steps.gate-result.outputs.result }}
      evidence: ${{ steps.gate-result.outputs.evidence }}
    steps:
      - name: Checkout exact PR head for the first-screen budget blocker
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node 20 for the first-screen budget blocker
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies for the first-screen budget blocker
        id: install
        if: needs.classify.outputs.gate_public_first_screen_budget == 'APPLICABLE'
        run: npm ci

      - name: Production build for the first-screen budget blocker
        id: build
        if: needs.classify.outputs.gate_public_first_screen_budget == 'APPLICABLE'
        run: npm run build

      - name: Public first-screen Chromium matrix
        id: first-screen
        if: needs.classify.outputs.gate_public_first_screen_budget == 'APPLICABLE'
        run: node scripts/ui/public-first-screen-budget-browser-smoke.mjs

      # `if: always()` — see the global-header emitter for the full rationale.
      - name: Publish first-screen budget blocker result
        id: gate-result
        if: always()
        env:
          GATE_ID: public-first-screen-budget
          GATE_APPLICABILITY: ${{ needs.classify.outputs.gate_public_first_screen_budget }}
          APPLICABILITY_DIGEST: ${{ needs.classify.outputs.digest }}
          STEP_OUTCOMES: >-
            [{"name":"npm ci","outcome":"${{ steps.install.outcome }}"},
            {"name":"npm run build","outcome":"${{ steps.build.outcome }}"},
            {"name":"node scripts/ui/public-first-screen-budget-browser-smoke.mjs","outcome":"${{ steps.first-screen.outcome }}"}]
        run: node scripts/ci/master-required-gate-gate-result.mjs

  # --- 2e. blocker: Contact Utility --------------------------------------------
  # Migrated by S2-04 batch 02 from .github/workflows/cbw-contact-utility.yml,
  # which stays BYTE-IDENTICAL and keeps reporting independently.
  #
  # NOTE THE INDEXABILITY CONDITION. Unlike every other indexability step in this
  # workflow, this one is gated on applicability ALONE. The legacy job leaves the
  # inventory unguarded, so it carries GitHub's implicit `success()` and a failed
  # Chromium smoke skips it. Copying the `always() && steps.build.outcome ==
  # 'success'` shape used by the global-header, public-SEO and exchange-preview
  # blockers would have made this step run in a state the legacy job never runs
  # it in. The parity suite reads both conditions off the legacy YAML and proves
  # the red/green behaviour matches over the full failure cross-product.
  contact-utility:
    name: Contact utility (unified blocker)
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      result: ${{ steps.gate-result.outputs.result }}
      evidence: ${{ steps.gate-result.outputs.evidence }}
    steps:
      - name: Checkout exact PR head for the contact utility blocker
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node 20 for the contact utility blocker
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies for the contact utility blocker
        id: install
        if: needs.classify.outputs.gate_contact_utility == 'APPLICABLE'
        run: npm ci

      - name: Production build for the contact utility blocker
        id: build
        if: needs.classify.outputs.gate_contact_utility == 'APPLICABLE'
        run: npm run build

      - name: Contact utility Chromium
        id: contact
        if: needs.classify.outputs.gate_contact_utility == 'APPLICABLE'
        run: node scripts/ui/contact-utility-browser-smoke.mjs

      # UNGUARDED IN THE LEGACY JOB, therefore unguarded here. See the block
      # comment on this job.
      - name: Indexability inventory for the contact utility blocker
        id: indexability
        if: needs.classify.outputs.gate_contact_utility == 'APPLICABLE'
        run: node scripts/seo/site-indexability-inventory.mjs

      # `if: always()` — see the global-header emitter for the full rationale.
      - name: Publish contact utility blocker result
        id: gate-result
        if: always()
        env:
          GATE_ID: contact-utility
          GATE_APPLICABILITY: ${{ needs.classify.outputs.gate_contact_utility }}
          APPLICABILITY_DIGEST: ${{ needs.classify.outputs.digest }}
          STEP_OUTCOMES: >-
            [{"name":"npm ci","outcome":"${{ steps.install.outcome }}"},
            {"name":"npm run build","outcome":"${{ steps.build.outcome }}"},
            {"name":"node scripts/ui/contact-utility-browser-smoke.mjs","outcome":"${{ steps.contact.outcome }}"},
            {"name":"node scripts/seo/site-indexability-inventory.mjs","outcome":"${{ steps.indexability.outcome }}"}]
        run: node scripts/ci/master-required-gate-gate-result.mjs

  # --- 2f. blocker: Exchange Preview Family ------------------------------------
  # Migrated by S2-04 batch 02 from
  # .github/workflows/cbw-exchange-preview-family.yml, which stays BYTE-IDENTICAL
  # and keeps reporting independently.
  #
  # OWNER-PREVIEW ONLY. Running this gate inside the required context authorizes
  # nothing: no publication, no indexing, no ranking, no affiliate action. It
  # proves the owner's preview routes still render and still stay out of the
  # index, which is exactly what the legacy gate proved.
  #
  # The legacy job's terminal `Summary` step writes a table into
  # $GITHUB_STEP_SUMMARY and executes no repository command. It is REPORTING, not
  # blocking work, and its unified counterpart is the result emitter below, so it
  # has no place in the blocking sequence. The parity suite does not take that on
  # trust: it proves the step is genuinely non-blocking (terminal, `if: always()`,
  # step-summary-only, running no npm/node command) before excluding it.
  exchange-preview-family:
    name: Exchange preview family (unified blocker)
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      result: ${{ steps.gate-result.outputs.result }}
      evidence: ${{ steps.gate-result.outputs.evidence }}
    steps:
      - name: Checkout exact PR head for the exchange preview blocker
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node 20 for the exchange preview blocker
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies for the exchange preview blocker
        id: install
        if: needs.classify.outputs.gate_exchange_preview_family == 'APPLICABLE'
        run: npm ci

      - name: Production build for the exchange preview blocker
        id: build
        if: needs.classify.outputs.gate_exchange_preview_family == 'APPLICABLE'
        run: npm run build

      - name: Exchange preview family Chromium
        id: browser
        if: needs.classify.outputs.gate_exchange_preview_family == 'APPLICABLE'
        run: node scripts/ui/exchange-preview-family-browser-smoke.mjs

      # The legacy condition preserved verbatim, conjoined with applicability, so
      # the inventory still runs — and can still fail the job — after a failed
      # Chromium smoke, exactly as it does in the legacy job.
      - name: Indexability inventory for the exchange preview blocker
        id: indexability
        if: always() && needs.classify.outputs.gate_exchange_preview_family == 'APPLICABLE' && steps.build.outcome == 'success'
        run: node scripts/seo/site-indexability-inventory.mjs

      # `if: always()` — see the global-header emitter for the full rationale.
      - name: Publish exchange preview blocker result
        id: gate-result
        if: always()
        env:
          GATE_ID: exchange-preview-family
          GATE_APPLICABILITY: ${{ needs.classify.outputs.gate_exchange_preview_family }}
          APPLICABILITY_DIGEST: ${{ needs.classify.outputs.digest }}
          STEP_OUTCOMES: >-
            [{"name":"npm ci","outcome":"${{ steps.install.outcome }}"},
            {"name":"npm run build","outcome":"${{ steps.build.outcome }}"},
            {"name":"node scripts/ui/exchange-preview-family-browser-smoke.mjs","outcome":"${{ steps.browser.outcome }}"},
            {"name":"node scripts/seo/site-indexability-inventory.mjs","outcome":"${{ steps.indexability.outcome }}"}]
        run: node scripts/ci/master-required-gate-gate-result.mjs

  # --- 3. THE STABLE REQUIRED CONTEXT ------------------------------------------
  # `if: always()` is what makes this context ALWAYS REPORTING. Without it the job
  # would be skipped whenever any upstream job failed or was skipped, and a
  # skipped job reports no conclusion at all — branch protection would sit on
  # "Expected — Waiting for status to be reported" forever.
  #
  # Reporting always is only safe because the aggregation below is fail-closed:
  # it does NOT infer success from silence. Every expected blocker must be proved
  # PASS or proved evidentially NOT_APPLICABLE; a failed, cancelled, skipped,
  # missing or unrecognized result is a FAILURE.
  #
  # This job deliberately does not `npm ci`: it must be able to report even when
  # dependency installation is what broke, so the aggregator depends on node
  # builtins only.
  master-required-gate:
    name: Master required gate
    needs:
      - classify
      - contact-utility
      - exchange-preview-family
      - global-header-interaction
      - public-first-screen-budget
      - public-navigation
      - public-seo-metadata
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head for aggregation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node 20 for aggregation
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The aggregator does NOT trust the digest it is handed. It recomputes the
      # canonical applicability digest itself, from the decision above plus THIS
      # run's identity (HEAD_SHA + the ambient GITHUB_RUN_ID / GITHUB_RUN_ATTEMPT),
      # and every digest claim — the classifier's included — is compared against
      # that recomputation. HEAD_SHA is therefore bound here exactly as it is for
      # the producers: to the PR head sha, so a decision digested for a different
      # head cannot be replayed into this run.
      - name: Aggregate blocker outcomes (fail-closed)
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CLASSIFY_JOB_RESULT: ${{ needs.classify.result }}
          CLASSIFIER_MATERIAL: ${{ needs.classify.outputs.material }}
          APPLICABILITY_JSON: ${{ needs.classify.outputs.applicability }}
          APPLICABILITY_DIGEST: ${{ needs.classify.outputs.digest }}
          GATE_CONTACT_UTILITY_JOB_RESULT: ${{ needs.contact-utility.result }}
          GATE_CONTACT_UTILITY_RESULT: ${{ needs.contact-utility.outputs.result }}
          GATE_CONTACT_UTILITY_EVIDENCE: ${{ needs.contact-utility.outputs.evidence }}
          GATE_EXCHANGE_PREVIEW_FAMILY_JOB_RESULT: ${{ needs.exchange-preview-family.result }}
          GATE_EXCHANGE_PREVIEW_FAMILY_RESULT: ${{ needs.exchange-preview-family.outputs.result }}
          GATE_EXCHANGE_PREVIEW_FAMILY_EVIDENCE: ${{ needs.exchange-preview-family.outputs.evidence }}
          GATE_GLOBAL_HEADER_INTERACTION_JOB_RESULT: ${{ needs.global-header-interaction.result }}
          GATE_GLOBAL_HEADER_INTERACTION_RESULT: ${{ needs.global-header-interaction.outputs.result }}
          GATE_GLOBAL_HEADER_INTERACTION_EVIDENCE: ${{ needs.global-header-interaction.outputs.evidence }}
          GATE_PUBLIC_FIRST_SCREEN_BUDGET_JOB_RESULT: ${{ needs.public-first-screen-budget.result }}
          GATE_PUBLIC_FIRST_SCREEN_BUDGET_RESULT: ${{ needs.public-first-screen-budget.outputs.result }}
          GATE_PUBLIC_FIRST_SCREEN_BUDGET_EVIDENCE: ${{ needs.public-first-screen-budget.outputs.evidence }}
          GATE_PUBLIC_NAVIGATION_JOB_RESULT: ${{ needs.public-navigation.result }}
          GATE_PUBLIC_NAVIGATION_RESULT: ${{ needs.public-navigation.outputs.result }}
          GATE_PUBLIC_NAVIGATION_EVIDENCE: ${{ needs.public-navigation.outputs.evidence }}
          GATE_PUBLIC_SEO_METADATA_JOB_RESULT: ${{ needs.public-seo-metadata.result }}
          GATE_PUBLIC_SEO_METADATA_RESULT: ${{ needs.public-seo-metadata.outputs.result }}
          GATE_PUBLIC_SEO_METADATA_EVIDENCE: ${{ needs.public-seo-metadata.outputs.evidence }}
        run: node scripts/ci/master-required-gate-aggregate.mjs
