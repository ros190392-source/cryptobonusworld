name: CBW Kazakhstan Market Passports 052D browser review

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [master]

permissions:
  contents: read

jobs:
  browser-review:
    if: github.event.pull_request.head.ref == 'qa/cbw-kazakhstan-market-passports-052d'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/cbw-preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4321/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/cbw-preview.log
          exit 1
      - name: Validate Kazakhstan market passports
        run: |
          mkdir -p qa-artifacts
          cat > .qa-kz-market-passports.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';

          const routes = [
            { exchange: 'binance', path: '/countries/kazakhstan/exchanges/binance/' },
            { exchange: 'bybit', path: '/countries/kazakhstan/exchanges/bybit/' },
            { exchange: 'okx', path: '/countries/kazakhstan/exchanges/okx/' },
          ];
          const viewports = [
            { name: 'desktop-1440', width: 1440, height: 1000 },
            { name: 'tablet-768', width: 768, height: 1024 },
            { name: 'mobile-390', width: 390, height: 844 },
          ];
          const bybitDateBoundIds = [
            'claim:kz:bybit:standard-kyc-mandatory',
            'claim:kz:bybit:p2p-platform-fee-zero',
            'claim:kz:bybit:p2p-kzt-usdt-per-ad-range',
          ];

          const browser = await chromium.launch({ headless: true });
          const sitemapResponse = await fetch('http://127.0.0.1:4321/sitemap.xml');
          const sitemapText = await sitemapResponse.text();
          const sitemapExcluded = routes.every(route => !sitemapText.includes(route.path));
          const results = [];
          let failed = false;

          try {
            for (const route of routes) {
              for (const viewport of viewports) {
                const page = await browser.newPage({ viewport });
                const consoleErrors = [];
                const pageErrors = [];
                const httpFailures = [];
                page.on('console', message => { if (message.type() === 'error') consoleErrors.push(message.text()); });
                page.on('pageerror', error => pageErrors.push(error.message));
                page.on('response', response => {
                  if (response.status() >= 400) httpFailures.push({ status: response.status(), url: response.url() });
                });

                const response = await page.goto(`http://127.0.0.1:4321${route.path}`, { waitUntil: 'networkidle' });
                const dimensions = await page.evaluate(() => ({
                  scrollWidth: document.documentElement.scrollWidth,
                  clientWidth: document.documentElement.clientWidth,
                  bodyScrollWidth: document.body.scrollWidth,
                }));
                const passport = page.locator(`[data-passport="${route.exchange}"]`);
                const robots = await page.locator('meta[name="robots"]').getAttribute('content');
                const flags = await page.locator('.flag-list strong').allTextContents();
                const checks = {
                  http200: response?.status() === 200,
                  noindex: robots === 'noindex, nofollow',
                  noCanonical: await page.locator('link[rel="canonical"]').count() === 0,
                  sitemapExcluded,
                  oneHeader: await page.locator('header.site-header[data-site-header]').count() === 1,
                  oneFooter: await page.locator('.site-footer').count() === 1,
                  passportIdentity: await passport.count() === 1,
                  offerUnderReview: await passport.getAttribute('data-offer-eligibility') === 'under_review',
                  fiveFlags: flags.length === 5,
                  allFlagsOff: flags.every(value => value.trim() === 'OFF'),
                  noRankingPosition: await page.getByText('Ranking position', { exact: true }).count() >= 1
                    && await page.getByText('None', { exact: true }).count() >= 1
                    && await page.locator('[data-ranking-row]').count() === 0,
                  noAffiliateLinks: await page.locator('a[href^="/go/"]').count() === 0,
                  noLocaleRoutes: await page.locator('a[href^="/ru/"], a[href^="/pl/"], a[href^="/uk/"], link[rel="alternate"][hreflang]').count() === 0,
                  noOverflow: dimensions.scrollWidth <= dimensions.clientWidth + 1 && dimensions.bodyScrollWidth <= dimensions.clientWidth + 1,
                  noConsoleErrors: consoleErrors.length === 0,
                  noPageErrors: pageErrors.length === 0,
                  noHttpFailures: httpFailures.length === 0,
                };

                if (route.exchange === 'binance') {
                  const enPanel = page.locator('[data-locale-panel="en"]');
                  const ruPanel = page.locator('[data-locale-panel="ru"]');
                  const enIds = await enPanel.locator('[data-claim-id]').evaluateAll(nodes => nodes.map(node => node.getAttribute('data-claim-id')));
                  const ruIds = await ruPanel.locator('[data-claim-id]').evaluateAll(nodes => nodes.map(node => node.getAttribute('data-claim-id')));
                  checks.binanceAvailability = await passport.getAttribute('data-availability') === 'limited';
                  checks.tenEnglishFacts = enIds.length === 10;
                  checks.tenRussianFacts = ruIds.length === 10;
                  checks.immutableClaimOrder = JSON.stringify(enIds) === JSON.stringify(ruIds);
                  checks.parityPassVisible = await page.getByText('Immutable claim parity: PASS', { exact: true }).count() === 1;
                  checks.englishInitiallyVisible = !(await enPanel.getAttribute('hidden'));
                  checks.russianInitiallyHidden = (await ruPanel.getAttribute('hidden')) !== null;
                  await page.locator('[data-locale-button="ru"]').click();
                  checks.russianToggleVisible = (await ruPanel.getAttribute('hidden')) === null;
                  checks.englishToggleHidden = (await enPanel.getAttribute('hidden')) !== null;
                }

                if (route.exchange === 'bybit') {
                  checks.bybitAvailability = await passport.getAttribute('data-availability') === 'available';
                  checks.sevenFacts = await page.locator('[data-claim-id]').count() === 7;
                  checks.dateBanner = await page.locator('[data-date-bound-banner]').count() === 1;
                  for (const claimId of bybitDateBoundIds) {
                    checks[`dateBound:${claimId}`] = await page.locator(`[data-claim-id="${claimId}"][data-date-bound="true"]`).count() === 1;
                  }
                }

                if (route.exchange === 'okx') {
                  checks.okxAvailabilityUnknown = await passport.getAttribute('data-availability') === 'unknown';
                  checks.okxExcluded = await passport.getAttribute('data-ranking-state') === 'excluded';
                  checks.conflictPreserving = await passport.getAttribute('data-conflict-preserving') === 'true';
                  checks.sixFacts = await page.locator('[data-claim-id]').count() === 6;
                  checks.conflictBanner = await page.locator('[data-conflict-banner]').count() === 1;
                  checks.fourOrMoreContradictions = await page.locator('[data-contradiction="true"]').count() >= 4;
                }

                const ok = Object.values(checks).every(Boolean);
                failed ||= !ok;
                const result = { route, viewport, ok, checks, dimensions, consoleErrors, pageErrors, httpFailures };
                results.push(result);
                console.log(JSON.stringify(result, null, 2));
                await page.screenshot({ path: `qa-artifacts/${route.exchange}-kazakhstan-passport-${viewport.name}.png`, fullPage: true });
                await page.close();
              }
            }
          } finally {
            await browser.close();
          }

          await writeFile('qa-artifacts/cbw-kazakhstan-market-passports-052d.json', JSON.stringify({ failed, sitemapExcluded, results }, null, 2));
          if (failed) process.exit(1);
          EOF
          node .qa-kz-market-passports.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbw-kazakhstan-market-passports-052d-review
          path: qa-artifacts/
          if-no-files-found: error
