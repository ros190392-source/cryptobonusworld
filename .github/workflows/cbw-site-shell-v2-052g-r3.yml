name: CBW Site Shell v2 052G browser review R3

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [master]

permissions:
  contents: read

jobs:
  browser-review:
    if: github.event.pull_request.head.ref == 'qa/cbw-site-shell-v2-052g-r3'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/cbw-preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4321/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/cbw-preview.log
          exit 1
      - name: Validate final shell
        run: |
          mkdir -p qa-artifacts
          cat > .qa-site-shell-r3.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';

          const routes = [['homepage','/'],['bybit','/bybit/'],['exchanges','/exchanges/'],['methodology','/methodology/']];
          const viewports = [['desktop-1440',1440,1000],['tablet-768',768,1024],['mobile-390',390,844]];
          const results = [];
          let failed = false;
          const browser = await chromium.launch({ headless: true });

          try {
            for (const [routeName,path] of routes) {
              for (const [viewportName,width,height] of viewports) {
                const page = await browser.newPage({ viewport: { width, height } });
                const consoleErrors = [];
                const pageErrors = [];
                const unexpectedHttpFailures = [];

                await page.route('**/api/exchange-votes*', route => route.fulfill({
                  status: 200,
                  contentType: 'application/json',
                  body: JSON.stringify({
                    averageRating: 0,
                    ratingCount: 0,
                    worksCount: 0,
                    didntWorkCount: 0,
                    userRating: null,
                    userHelpfulVote: null,
                  }),
                }));

                page.on('console', message => { if (message.type() === 'error') consoleErrors.push(message.text()); });
                page.on('pageerror', error => pageErrors.push(error.message));
                page.on('response', response => {
                  if (response.status() >= 400) unexpectedHttpFailures.push({ status: response.status(), url: response.url() });
                });

                const response = await page.goto(`http://127.0.0.1:4321${path}`, { waitUntil: 'networkidle' });
                const dimensions = await page.evaluate(() => ({
                  scrollWidth: document.documentElement.scrollWidth,
                  clientWidth: document.documentElement.clientWidth,
                  bodyScrollWidth: document.body.scrollWidth,
                }));

                const checks = {
                  http200: response?.status() === 200,
                  oneHeader: await page.locator('.site-header').count() === 1,
                  oneFooter: await page.locator('.site-footer').count() === 1,
                  noFinderLinks: await page.locator('a[href*="#finder"]').count() === 0,
                  top10HeaderLink: await page.locator('.header-cta[href="/#exchanges"]').count() === 1,
                  globalContext: await page.getByText('Global', { exact: true }).count() >= 1,
                  englishContext: await page.getByText('English', { exact: true }).count() >= 1,
                  noOverflow: dimensions.scrollWidth <= dimensions.clientWidth + 1 && dimensions.bodyScrollWidth <= dimensions.clientWidth + 1,
                  noConsoleErrors: consoleErrors.length === 0,
                  noPageErrors: pageErrors.length === 0,
                  noUnexpectedHttpFailures: unexpectedHttpFailures.length === 0,
                };

                if (width < 900) {
                  const button = page.locator('[data-menu-button]');
                  checks.mobileButtonVisible = await button.isVisible();
                  checks.mobilePanelInitiallyHidden = await page.locator('[data-mobile-panel]').isHidden();
                  await button.click();
                  checks.mobilePanelOpens = await page.locator('[data-mobile-panel]').isVisible();
                  checks.bodyScrollLock = await page.locator('body').evaluate(el => el.classList.contains('cbw-menu-open'));
                  checks.ariaExpanded = await button.getAttribute('aria-expanded') === 'true';
                  await page.keyboard.press('Escape');
                  checks.escapeClosesMenu = await page.locator('[data-mobile-panel]').isHidden();
                  checks.scrollLockCleared = await page.locator('body').evaluate(el => !el.classList.contains('cbw-menu-open'));
                } else {
                  checks.desktopNavVisible = await page.locator('.desktop-nav').isVisible();
                  checks.desktopCtaVisible = await page.locator('.header-cta').isVisible();
                  checks.mobileButtonHidden = await page.locator('[data-menu-button]').isHidden();
                }

                if (routeName === 'bybit') {
                  const ctas = page.locator('.p2-cta-bar');
                  const count = await ctas.count();
                  checks.bybitHasMidArticleCtas = count >= 2;
                  checks.bybitAffiliatePathsPreserved = true;
                  checks.bybitCtaGeometry = true;
                  checks.bybitCtaAmber = true;
                  for (let i = 0; i < count; i += 1) {
                    const cta = ctas.nth(i);
                    const box = await cta.boundingBox();
                    checks.bybitAffiliatePathsPreserved &&= await cta.getAttribute('href') === '/go/bybit/';
                    checks.bybitCtaGeometry &&= Boolean(box && box.x >= 19 && width - (box.x + box.width) >= 19 && box.width <= 361 && box.height >= 48 && box.height <= 64);
                    checks.bybitCtaAmber &&= await cta.evaluate(el => getComputedStyle(el).backgroundColor) === 'rgb(247, 147, 26)';
                  }
                }

                const ok = Object.values(checks).every(Boolean);
                failed ||= !ok;
                const result = { routeName,path,viewportName,width,height,ok,checks,dimensions,consoleErrors,pageErrors,unexpectedHttpFailures };
                results.push(result);
                console.log(JSON.stringify(result, null, 2));
                await page.screenshot({ path: `qa-artifacts/${routeName}-${viewportName}.png`, fullPage: true });
                await page.close();
              }
            }
          } finally {
            await browser.close();
          }

          await writeFile('qa-artifacts/cbw-site-shell-v2-052g-r3-review.json', JSON.stringify({ failed, runtimeBoundary: '/api/exchange-votes', results }, null, 2));
          if (failed) process.exit(1);
          EOF
          node .qa-site-shell-r3.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbw-site-shell-v2-052g-r3-review
          path: qa-artifacts/
          if-no-files-found: error
