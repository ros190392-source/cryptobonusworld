name: CBW Ranking-First UI Advisory

on:
  pull_request:
    branches:
      - master
    paths:
      - 'src/pages/**'
      - 'src/layouts/**'
      - 'src/components/**'
      - 'src/styles/site-standard-v1.css'
      - 'src/styles/site-shell.css'
      - 'src/styles/info-pages-v2.css'
      - 'src/styles/faq-page-v2.css'
      - 'src/data/siteStandard/**'
      - 'src/data/header/**'
      - 'src/data/contracts/countryInput.ts'
      - 'scripts/ui/**'
      - '.github/workflows/cbw-ranking-first-ui-advisory.yml'

permissions:
  contents: read

concurrency:
  group: cbw-ranking-first-ui-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ranking-first-ui:
    name: Product system UI advisory (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Product system foundation regression
        id: foundation
        run: node scripts/ui/product-system-foundation-test.mjs

      - name: Production build
        id: build
        run: npm run build

      - name: Ranking-first Chromium smoke
        id: browser
        run: node scripts/ui/ranking-first-browser-smoke.mjs

      - name: Advisory summary
        if: always()
        env:
          FOUNDATION: ${{ steps.foundation.outcome }}
          BUILD: ${{ steps.build.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
        run: |
          {
            echo '### CBW Product System UI Advisory'
            echo ''
            echo '| Check | Result |'
            echo '|---|---|'
            echo "| Product system foundation | ${FOUNDATION} |"
            echo "| Production build | ${BUILD} |"
            echo "| Ranking-first Chromium smoke | ${BROWSER} |"
            echo ''
            echo '> Read-only visual/product advisory. It performs no publish, import or deploy action.'
          } >> "$GITHUB_STEP_SUMMARY"
