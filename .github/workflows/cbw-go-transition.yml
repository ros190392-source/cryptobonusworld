name: CBW Go Transition

on:
  pull_request:
    branches:
      - master
    paths:
      - 'src/pages/go/**'
      - 'src/data/publicCommercialRoute.ts'
      - 'src/data/contracts/ownerConfirmedCommercialAuthority.ts'
      - 'scripts/ui/go-transition-browser-smoke.mjs'
      - '.github/workflows/cbw-go-transition.yml'

permissions:
  contents: read

concurrency:
  group: cbw-go-transition-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  go-transition:
    name: Governed go transition hard gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Owner-confirmed authority split regression
        run: node scripts/portal/owner-confirmed-authority-split-test.mjs

      - name: Production build
        run: npm run build

      - name: Governed go transition Chromium
        run: node scripts/ui/go-transition-browser-smoke.mjs

      - name: Redirect family matrix
        run: node scripts/seo/redirect-family-matrix-test.mjs

      - name: Indexability inventory
        run: node scripts/seo/site-indexability-inventory.mjs
