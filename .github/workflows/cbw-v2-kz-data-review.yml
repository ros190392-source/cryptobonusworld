name: CBW Portal v2 KZ data browser review

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - master

permissions:
  contents: read

jobs:
  browser-review:
    if: github.event.pull_request.head.ref == 'qa/cbw-v2-kz-data-review-051'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout exact QA branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production site
        run: npm run build

      - name: Start Astro preview
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/cbw-v2-preview.log 2>&1 &
          echo $! > /tmp/cbw-v2-preview.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4321/__design/cbw-v2/market-passport/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/cbw-v2-preview.log
          exit 1

      - name: Capture and validate KZ review routes
        run: |
          mkdir -p qa-artifacts
          cat > .qa-cbw-v2-kz-review.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';

          const routes = [
            { name: 'foundation', path: '/__design/cbw-v2/foundation/' },
            { name: 'homepage', path: '/__design/cbw-v2/homepage/' },
            { name: 'country', path: '/__design/cbw-v2/country/' },
            { name: 'country-ranking', path: '/__design/cbw-v2/country-ranking/' },
            { name: 'market-passport', path: '/__design/cbw-v2/market-passport/' },
          ];

          const viewports = [
            { name: 'desktop-1440', width: 1440, height: 1000 },
            { name: 'tablet-768', width: 768, height: 1024 },
            { name: 'mobile-390', width: 390, height: 844 },
          ];

          const results = [];
          let failed = false;
          const browser = await chromium.launch({ headless: true });

          try {
            for (const route of routes) {
              for (const viewport of viewports) {
                const page = await browser.newPage({ viewport });
                const consoleErrors = [];
                const pageErrors = [];
                page.on('console', message => {
                  if (message.type() === 'error') consoleErrors.push(message.text());
                });
                page.on('pageerror', error => pageErrors.push(error.message));

                const response = await page.goto(`http://127.0.0.1:4321${route.path}`, {
                  waitUntil: 'networkidle',
                });

                const title = await page.title();
                const robots = await page.locator('meta[name="robots"]').getAttribute('content');
                const dimensions = await page.evaluate(() => ({
                  scrollWidth: document.documentElement.scrollWidth,
                  clientWidth: document.documentElement.clientWidth,
                  bodyScrollWidth: document.body.scrollWidth,
                }));

                const checks = {
                  httpOk: response?.status() === 200,
                  titlePresent: title.trim().length > 0,
                  noindex: typeof robots === 'string' && robots.toLowerCase().includes('noindex'),
                  noHorizontalOverflow:
                    dimensions.scrollWidth <= dimensions.clientWidth + 1
                    && dimensions.bodyScrollWidth <= dimensions.clientWidth + 1,
                  noConsoleErrors: consoleErrors.length === 0,
                  noPageErrors: pageErrors.length === 0,
                };

                const routeChecks = {};

                if (route.name === 'country-ranking') {
                  routeChecks.threeCandidates = await page.locator('.candidate-row').count() === 3;
                  routeChecks.threeUnrankedPlaceholders = await page.locator('.rank-placeholder').count() === 3;
                  routeChecks.readinessBlocked = await page.getByText('BLOCKED', { exact: true }).count() >= 1;
                  routeChecks.twoOfThreeProfiles = await page.getByText('2/3', { exact: true }).count() >= 1;
                  routeChecks.noAffiliateRoute = await page.locator('a[href^="/go/"]').count() === 0;
                }

                if (route.name === 'market-passport') {
                  routeChecks.eightEnglishFacts = await page.locator('[data-locale-panel="en"] .field-row').count() === 8;
                  routeChecks.eightRussianFacts = await page.locator('[data-locale-panel="ru"] .field-row').count() === 8;
                  routeChecks.parityPass = await page.getByText('EN/RU fact parity PASS', { exact: true }).count() === 1;
                  routeChecks.noAffiliateCTA = await page.getByText('No affiliate CTA', { exact: true }).count() === 1;
                  routeChecks.noAffiliateRoute = await page.locator('a[href^="/go/"]').count() === 0;

                  const englishIds = await page.locator('[data-locale-panel="en"] .fact-meta code').allTextContents();
                  const russianIds = await page.locator('[data-locale-panel="ru"] .fact-meta code').allTextContents();
                  routeChecks.claimIdsMatch = JSON.stringify(englishIds) === JSON.stringify(russianIds);

                  await page.screenshot({
                    path: `qa-artifacts/${route.name}-en-${viewport.name}.png`,
                    fullPage: true,
                  });

                  await page.locator('[data-locale-button="ru"]').click();
                  routeChecks.russianPanelVisible = await page.locator('[data-locale-panel="ru"]').isVisible();
                  routeChecks.englishPanelHidden = await page.locator('[data-locale-panel="en"]').isHidden();
                  routeChecks.russianHeadingVisible = await page.getByText('Binance в Казахстане', { exact: true }).isVisible();

                  await page.screenshot({
                    path: `qa-artifacts/${route.name}-ru-${viewport.name}.png`,
                    fullPage: true,
                  });
                } else {
                  await page.screenshot({
                    path: `qa-artifacts/${route.name}-${viewport.name}.png`,
                    fullPage: true,
                  });
                }

                const ok = [
                  ...Object.values(checks),
                  ...Object.values(routeChecks),
                ].every(Boolean);
                if (!ok) failed = true;

                const result = {
                  route,
                  viewport,
                  ok,
                  checks,
                  routeChecks,
                  status: response?.status() ?? null,
                  title,
                  robots,
                  dimensions,
                  consoleErrors,
                  pageErrors,
                };
                results.push(result);
                console.log(JSON.stringify(result, null, 2));
                await page.close();
              }
            }
          } finally {
            await browser.close();
          }

          await writeFile(
            'qa-artifacts/cbw-v2-kz-data-browser-review.json',
            JSON.stringify({ failed, results }, null, 2),
          );
          if (failed) process.exit(1);
          EOF
          node ./.qa-cbw-v2-kz-review.mjs

      - name: Upload browser review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbw-portal-v2-kz-data-browser-review
          path: qa-artifacts/
          if-no-files-found: error
