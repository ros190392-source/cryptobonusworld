name: CBW Sitewide Layout Audit 053A browser review R2

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [master]

permissions:
  contents: read

jobs:
  browser-review:
    if: github.event.pull_request.head.ref == 'qa/cbw-sitewide-layout-audit-053a-r2'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/cbw-preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4321/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/cbw-preview.log
          exit 1
      - name: Validate corrected audit hub
        run: |
          mkdir -p qa-artifacts
          cat > .qa-layout-audit-r2.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';

          const viewports = [
            ['desktop-1440', 1440, 900],
            ['tablet-768', 768, 1024],
            ['mobile-390', 390, 844],
          ];
          const results = [];
          let failed = false;
          const browser = await chromium.launch({ headless: true });

          try {
            for (const [name, width, height] of viewports) {
              const page = await browser.newPage({ viewport: { width, height } });
              const consoleErrors = [];
              const pageErrors = [];
              const httpFailures = [];
              page.on('console', message => { if (message.type() === 'error') consoleErrors.push(message.text()); });
              page.on('pageerror', error => pageErrors.push(error.message));
              page.on('response', response => { if (response.status() >= 400) httpFailures.push({ status: response.status(), url: response.url() }); });

              const response = await page.goto('http://127.0.0.1:4321/__design/layout-audit/', { waitUntil: 'networkidle' });
              const dimensions = await page.evaluate(() => ({
                scrollWidth: document.documentElement.scrollWidth,
                clientWidth: document.documentElement.clientWidth,
                bodyScrollWidth: document.body.scrollWidth,
              }));
              const robots = await page.locator('meta[name="robots"]').getAttribute('content');
              const checks = {
                http200: response?.status() === 200,
                noindex: robots === 'noindex, nofollow',
                auditRoot: await page.locator('[data-layout-audit]').count() === 1,
                manifestPass: await page.locator('[data-layout-audit][data-audit-pass="true"]').count() === 1,
                findingCount: await page.locator('[data-finding]').count() === 8,
                p0Count: await page.locator('[data-finding^="LAYOUT-P0"], [data-finding^="SEO-P0"]').count() === 4,
                currentWidthCount: await page.locator('[data-current-width]').count() === 7,
                targetContainerCount: await page.locator('[data-container-role]').count() === 4,
                familyCount: await page.locator('[data-family]').count() === 10,
                countryHubFamily: await page.locator('[data-family="country-review-hub"]').count() === 1,
                countryPassportFamily: await page.locator('[data-family="country-review-passport"]').count() === 1,
                validationCount: await page.locator('[data-validation]').count() === 9,
                allValidationPass: await page.locator('[data-validation][data-passed="true"]').count() === 9,
                noCountryActions: await page.locator('a[href^="/countries/"]').count() === 0,
                noAffiliateLinks: await page.locator('a[href^="/go/"]').count() === 0,
                oneHeader: await page.locator('.site-header').count() === 1,
                oneFooter: await page.locator('.site-footer').count() === 1,
                noOverflow: dimensions.scrollWidth <= dimensions.clientWidth + 1 && dimensions.bodyScrollWidth <= dimensions.clientWidth + 1,
                noConsoleErrors: consoleErrors.length === 0,
                noPageErrors: pageErrors.length === 0,
                noHttpFailures: httpFailures.length === 0,
              };
              const ok = Object.values(checks).every(Boolean);
              failed ||= !ok;
              const result = { name, width, height, ok, checks, dimensions, consoleErrors, pageErrors, httpFailures };
              results.push(result);
              console.log(JSON.stringify(result, null, 2));
              await page.screenshot({ path: `qa-artifacts/layout-audit-r2-${name}.png`, fullPage: true });
              await page.close();
            }
          } finally {
            await browser.close();
          }

          await writeFile('qa-artifacts/cbw-sitewide-layout-audit-053a-r2.json', JSON.stringify({ failed, results }, null, 2));
          if (failed) process.exit(1);
          EOF
          node .qa-layout-audit-r2.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbw-sitewide-layout-audit-053a-r2
          path: qa-artifacts/
          if-no-files-found: error
