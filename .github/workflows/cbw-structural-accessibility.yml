name: CBW Structural Accessibility

on:
  pull_request:
    branches:
      - master
    paths:
      - 'src/pages/**'
      - 'src/layouts/**'
      - 'src/components/**'
      - 'src/styles/**'
      - 'scripts/ui/structural-accessibility-browser-smoke.mjs'
      - '.github/workflows/cbw-structural-accessibility.yml'

permissions:
  contents: read

concurrency:
  group: cbw-structural-accessibility-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  structural-accessibility:
    name: Structural accessibility hard gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Production build
        id: build
        run: npm run build

      - name: Structural accessibility Chromium
        run: node scripts/ui/structural-accessibility-browser-smoke.mjs

      - name: Indexability inventory
        if: always() && steps.build.outcome == 'success'
        run: node scripts/seo/site-indexability-inventory.mjs
