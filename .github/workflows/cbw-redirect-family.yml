name: CBW Redirect Family

on:
  pull_request:
    branches:
      - master
    paths:
      - 'src/pages/**'
      - 'src/components/site-standard/RedirectPage.astro'
      - 'scripts/seo/redirect-family-matrix-test.mjs'
      - '.github/workflows/cbw-redirect-family.yml'

permissions:
  contents: read

concurrency:
  group: cbw-redirect-family-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  redirect-family:
    name: Redirect family hard gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Production build
        id: build
        run: npm run build

      - name: Redirect family matrix
        run: node scripts/seo/redirect-family-matrix-test.mjs

      - name: Indexability inventory
        if: always() && steps.build.outcome == 'success'
        run: node scripts/seo/site-indexability-inventory.mjs
