name: CBW MarketProfile Pipeline Advisory

on:
  pull_request:
    branches:
      - master
    paths:
      - 'src/data/contracts/marketProfile*.ts'
      - 'src/data/contracts/researchToMarketProfileV1Bridge.ts'
      - 'src/data/candidates/**'
      - 'scripts/portal/marketprofile-pipeline-*.mjs'
      - 'scripts/portal/marketprofile-candidate-review-test.mjs'
      - 'scripts/portal/marketprofile-promotion-gate-test.mjs'
      - 'scripts/portal/research-marketprofile-bridge-test.mjs'
      - '.github/workflows/cbw-marketprofile-pipeline-advisory.yml'

permissions:
  contents: read

concurrency:
  group: cbw-marketprofile-pipeline-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  marketprofile-pipeline:
    name: MarketProfile pipeline advisory (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Strict TypeScript MarketProfile pipeline
        id: typecheck
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t candidate_files < <(find src/data/candidates -type f -name '*.ts' | sort)
          node_modules/.bin/tsc --noEmit --strict --skipLibCheck --resolveJsonModule \
            --moduleResolution bundler --module esnext --target es2022 \
            src/data/contracts/portalFactory.ts \
            src/data/contracts/marketProfileV1.ts \
            src/data/contracts/researchToMarketProfileV1Bridge.ts \
            src/data/contracts/marketProfileCandidateReview.ts \
            src/data/contracts/marketProfilePromotionGate.ts \
            src/data/contracts/marketProfileCandidateBundle.ts \
            "${candidate_files[@]}"

      - name: MarketProfile pipeline regressions
        id: pipeline
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(scripts/portal/marketprofile-pipeline-*.mjs)
          if [ "${#tests[@]}" -eq 0 ]; then
            echo 'No MarketProfile pipeline regressions found.' >&2
            exit 1
          fi
          for test in "${tests[@]}"; do
            echo "==> $test"
            node "$test"
          done

      - name: Candidate review packet regression
        id: review
        run: node scripts/portal/marketprofile-candidate-review-test.mjs

      - name: Promotion gate regression
        id: promotion
        run: node scripts/portal/marketprofile-promotion-gate-test.mjs

      - name: Research to MarketProfile bridge regression
        id: bridge
        run: node scripts/portal/research-marketprofile-bridge-test.mjs

      - name: Country Foundation regression
        id: country
        run: node scripts/portal/country-foundation-test.mjs

      - name: Production test-authority guard
        id: guard
        run: npm run portal:guard:test-authority

      - name: Portal contracts
        id: contracts
        run: npm run portal:contracts:test

      - name: Full site build
        id: build
        run: npm run build

      - name: Advisory summary
        if: always()
        env:
          TYPECHECK: ${{ steps.typecheck.outcome }}
          PIPELINE: ${{ steps.pipeline.outcome }}
          REVIEW: ${{ steps.review.outcome }}
          PROMOTION: ${{ steps.promotion.outcome }}
          BRIDGE: ${{ steps.bridge.outcome }}
          COUNTRY: ${{ steps.country.outcome }}
          GUARD: ${{ steps.guard.outcome }}
          CONTRACTS: ${{ steps.contracts.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          {
            echo '### CBW MarketProfile Pipeline Advisory'
            echo ''
            echo '| Check | Result |'
            echo '|---|---|'
            echo "| Strict TypeScript | ${TYPECHECK} |"
            echo "| Pipeline regressions | ${PIPELINE} |"
            echo "| Candidate review regression | ${REVIEW} |"
            echo "| Promotion gate regression | ${PROMOTION} |"
            echo "| Research bridge regression | ${BRIDGE} |"
            echo "| Country Foundation regression | ${COUNTRY} |"
            echo "| Test-authority guard | ${GUARD} |"
            echo "| Portal contracts | ${CONTRACTS} |"
            echo "| Full build | ${BUILD} |"
            echo ''
            echo '> This workflow is read-only validation. It performs no MarketProfile import, registry mutation, publication or deploy.'
          } >> "$GITHUB_STEP_SUMMARY"
