name: CBW Site Standard Foundation 053B Review

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [master]

permissions:
  contents: read

jobs:
  browser-review:
    if: github.event.pull_request.head.ref == 'qa/cbw-site-standard-foundation-053b'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/cbw-preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4321/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/cbw-preview.log
          exit 1
      - name: Validate Site Standard foundation
        run: |
          mkdir -p qa-artifacts
          cat > .qa-site-standard-foundation.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';

          const viewports = [
            { name: 'desktop-1440x900', width: 1440, height: 900, gutter: 32, introMax: 300 },
            { name: 'tablet-768x1024', width: 768, height: 1024, gutter: 24, introMax: 300 },
            { name: 'mobile-390x844', width: 390, height: 844, gutter: 20, introMax: 280 },
          ];
          const results = [];
          let failed = false;
          const browser = await chromium.launch({ headless: true });

          try {
            for (const viewport of viewports) {
              const page = await browser.newPage({ viewport });
              const consoleErrors = [];
              const pageErrors = [];
              const httpFailures = [];
              page.on('console', message => { if (message.type() === 'error') consoleErrors.push(message.text()); });
              page.on('pageerror', error => pageErrors.push(error.message));
              page.on('response', response => {
                if (response.status() >= 400) httpFailures.push({ status: response.status(), url: response.url() });
              });

              const response = await page.goto('http://127.0.0.1:4321/__design/site-standard-foundation/', { waitUntil: 'networkidle' });
              const dimensions = await page.evaluate(() => ({
                scrollWidth: document.documentElement.scrollWidth,
                clientWidth: document.documentElement.clientWidth,
                bodyScrollWidth: document.body.scrollWidth,
              }));
              const rootTokens = await page.evaluate(() => {
                const style = getComputedStyle(document.documentElement);
                return {
                  shell: style.getPropertyValue('--cbw-width-shell').trim(),
                  wide: style.getPropertyValue('--cbw-width-wide').trim(),
                  standard: style.getPropertyValue('--cbw-width-standard').trim(),
                  prose: style.getPropertyValue('--cbw-width-prose').trim(),
                  narrow: style.getPropertyValue('--cbw-width-narrow').trim(),
                  gutter: style.getPropertyValue('--cbw-gutter').trim(),
                  action: style.getPropertyValue('--cbw-action').trim(),
                  evidence: style.getPropertyValue('--cbw-evidence').trim(),
                };
              });
              const firstViewport = page.locator('.cbw-first-viewport');
              const firstViewportBox = await firstViewport.boundingBox();
              const firstContainer = page.locator('.cbw-first-viewport .cbw-container').first();
              const paddingLeft = await firstContainer.evaluate(element => parseFloat(getComputedStyle(element).paddingLeft));
              const fixtureRows = page.locator('.fixture-row');
              const fixturePasses = page.locator('.fixture-row.pass');
              const roleRows = page.locator('.role-row');
              const contractCards = page.locator('.contract-card');
              const familyRows = page.locator('.family-table tbody tr');

              const checks = {
                http200: response?.status() === 200,
                noindex: (await page.locator('meta[name="robots"]').getAttribute('content')) === 'noindex, nofollow',
                oneHeader: await page.locator('.site-header').count() === 1,
                oneFooter: await page.locator('.site-footer').count() === 1,
                foundationPass: await page.getByText('FOUNDATION PASS', { exact: true }).count() === 1,
                nineFixtures: await fixtureRows.count() === 9,
                allFixturesPass: await fixturePasses.count() === 9,
                fiveContainerRoles: await roleRows.count() === 5,
                sevenContracts: await contractCards.count() === 7,
                twelveFamilies: await familyRows.count() === 12,
                shellToken: rootTokens.shell === '1180px',
                wideToken: rootTokens.wide === '1180px',
                standardToken: rootTokens.standard === '960px',
                proseToken: rootTokens.prose === '760px',
                narrowToken: rootTokens.narrow === '560px',
                gutterToken: rootTokens.gutter === `${viewport.gutter}px`,
                containerPadding: Math.abs(paddingLeft - viewport.gutter) <= 0.5,
                introBudget: Boolean(firstViewportBox && firstViewportBox.height <= viewport.introMax + 1),
                amberAction: rootTokens.action.toLowerCase() === '#f7931a' || rootTokens.action === 'rgb(247, 147, 26)',
                greenEvidence: rootTokens.evidence.toLowerCase() === '#16834b' || rootTokens.evidence === 'rgb(22, 131, 75)',
                noCountryLinks: await page.locator('a[href^="/countries/"]').count() === 0,
                noAffiliateLinks: await page.locator('a[href^="/go/"]').count() === 0,
                noOverflow: dimensions.scrollWidth <= dimensions.clientWidth + 1 && dimensions.bodyScrollWidth <= dimensions.clientWidth + 1,
                noConsoleErrors: consoleErrors.length === 0,
                noPageErrors: pageErrors.length === 0,
                noHttpFailures: httpFailures.length === 0,
              };

              const ok = Object.values(checks).every(Boolean);
              failed ||= !ok;
              const result = { viewport, ok, checks, rootTokens, firstViewportHeight: firstViewportBox?.height ?? null, paddingLeft, dimensions, consoleErrors, pageErrors, httpFailures };
              results.push(result);
              console.log(JSON.stringify(result, null, 2));
              await page.screenshot({ path: `qa-artifacts/site-standard-foundation-${viewport.name}.png`, fullPage: true });
              await page.close();
            }
          } finally {
            await browser.close();
          }

          await writeFile('qa-artifacts/CBW_SITE_STANDARD_FOUNDATION_053B.json', JSON.stringify({ failed, results }, null, 2));
          if (failed) process.exit(1);
          EOF
          node .qa-site-standard-foundation.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbw-site-standard-foundation-053b-review
          path: qa-artifacts/
          if-no-files-found: error
          retention-days: 90
