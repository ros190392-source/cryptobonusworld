name: CBW ResearchOps Factory validate (advisory, read-only)

# Read-only, FAIL-CLOSED PR validation for the ResearchOps Subscription Factory.
# Runs only the direct Node CLI/test runner. Never merges, never deploys,
# never creates issues/branches/PRs, never calls an AI provider, never touches master.

on:
  pull_request:
    paths:
      - 'research-ops/**'
      - '.github/workflows/cbw-researchops-factory-validate.yml'

permissions:
  contents: read

concurrency:
  group: researchops-factory-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the exact trusted PR head SHA (read-only)
        uses: actions/checkout@v4
        with:
          # R1 — check out the EXACT trusted PR head commit, not GitHub's synthetic
          # refs/pull/N/merge commit. This makes `git rev-parse HEAD` == the trusted
          # event head SHA so the V4-C7 checkout-integrity guard passes deliberately
          # (and still fails closed on any real mismatch). Full history for ancestry.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax-check factory sources
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            node --check "$f" || fail=1
          done < <(find research-ops/factory-v1-1 -type f -name '*.mjs' | sort)
          exit $fail

      - name: Run factory fixtures
        run: node research-ops/factory-v1-1/fixtures/run.mjs

      - name: Verify trusted event metadata and checkout integrity (fail-closed)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          [ -n "$BASE_SHA" ] || { echo "empty base sha"; exit 1; }
          [ -n "$HEAD_SHA" ] || { echo "empty head sha"; exit 1; }
          [ -n "$HEAD_BRANCH" ] || { echo "empty head branch"; exit 1; }
          [ -n "$BASE_BRANCH" ] || { echo "empty base branch"; exit 1; }
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          # V4-C7 — checkout/event/workspace integrity, fail-closed. HEAD now equals the
          # trusted head SHA because we deliberately checked out head.sha (not the merge).
          [ "$(git rev-parse --is-shallow-repository)" = "false" ] || { echo "shallow repository"; exit 1; }
          [ "$(git rev-parse HEAD)" = "$HEAD_SHA" ] || { echo "checked-out HEAD != trusted head sha"; exit 1; }
          [ "$(git rev-parse --show-toplevel)" = "$GITHUB_WORKSPACE" ] || { echo "workspace != resolved worktree root"; exit 1; }
          git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA" || { echo "head does not descend approved base"; exit 1; }
          # Does the APPROVED BASE already carry the V4 policy modules? Decides descendant
          # vs one-time bootstrap enforcement below.
          if git cat-file -e "${BASE_SHA}:research-ops/factory-v1-1/lib/bootstrap.mjs" 2>/dev/null; then
            BASE_HAS_V4=true
          else
            BASE_HAS_V4=false
          fi
          {
            echo "BASE_SHA=$BASE_SHA"; echo "HEAD_SHA=$HEAD_SHA"
            echo "HEAD_BRANCH=$HEAD_BRANCH"; echo "BASE_BRANCH=$BASE_BRANCH"
            echo "PR_NUMBER=$PR_NUMBER"; echo "BASE_HAS_V4=$BASE_HAS_V4"
          } >> "$GITHUB_ENV"

      - name: Resolve trusted enforcement root and worker diff (fail-closed)
        run: |
          set -euo pipefail
          # R1 pinned V4 bootstrap anchor (immutable SHAs; used only for the exact V4
          # transition range when the approved base predates the V4 policy).
          ANCHOR_ISSUE=60
          ANCHOR_APPROVED_BASE_SHA=07d0e38a540355244b2bcab0258d3eb5463ed1af
          ANCHOR_FROZEN_SETUP_SHA=063078ac56423d3ab3544f17e69b09ed4bdc6d9e
          if [ "$BASE_HAS_V4" = "true" ]; then
            # DESCENDANT — normal path: policy is executed from the PROTECTED BASE. R2 —
            # the new task's owner setup phase adds exactly the three role-specific setup
            # records before any worker/result commit. Discover the UNIQUE frozen owner-
            # setup boundary generically (from the protected-base policy), then evaluate
            # the worker diff frozen-setup -> head. The governed record is read from the
            # frozen setup commit; policy authority never comes from mutable worker head.
            echo "ENFORCEMENT: DESCENDANT (protected base policy)"
            git worktree add --detach ../trusted-base "$BASE_SHA"
            ENFORCE_BIN="../trusted-base/research-ops/factory-v1-1/bin/researchops.mjs"
            FROZEN_SETUP_LINE="$(node "$ENFORCE_BIN" discover-setup-boundary \
              --approved-base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" \
              --head-branch "$HEAD_BRANCH" --repo-root "$GITHUB_WORKSPACE" | sed -n 's/^FROZEN_SETUP_SHA=//p')"
            [ -n "$FROZEN_SETUP_LINE" ] || { echo "could not resolve a unique frozen setup boundary"; exit 1; }
            DIFF_BASE="$FROZEN_SETUP_LINE"; APPROVED_BASE_SHA="$BASE_SHA"
          else
            # BOOTSTRAP — one-time, pinned. The approved base predates V4; validate ONLY
            # this exact remediation range from the VERIFIED head policy (HEAD==head.sha).
            [ "$BASE_SHA" = "$ANCHOR_APPROVED_BASE_SHA" ] || { echo "base sha != anchored approved base"; exit 1; }
            git cat-file -e "${ANCHOR_FROZEN_SETUP_SHA}^{commit}"
            git merge-base --is-ancestor "$ANCHOR_FROZEN_SETUP_SHA" "$HEAD_SHA" || { echo "head does not descend frozen setup"; exit 1; }
            # Fail closed unless the pinned anchor matches this exact issue/PR/branches.
            node research-ops/factory-v1-1/bin/researchops.mjs resolve-enforcement \
              --issue "$ANCHOR_ISSUE" --pull-request "$PR_NUMBER" \
              --head-branch "$HEAD_BRANCH" --base-branch "$BASE_BRANCH" \
              --approved-base-sha "$ANCHOR_APPROVED_BASE_SHA" \
              --frozen-setup-sha "$ANCHOR_FROZEN_SETUP_SHA" \
              --head-sha "$HEAD_SHA" --repo-root "$GITHUB_WORKSPACE"
            # Owner setup phase must have introduced exactly the governed setup files.
            node research-ops/factory-v1-1/bin/researchops.mjs check-setup-phase \
              --approved-base-sha "$ANCHOR_APPROVED_BASE_SHA" \
              --frozen-setup-sha "$ANCHOR_FROZEN_SETUP_SHA" --repo-root "$GITHUB_WORKSPACE"
            ENFORCE_BIN="research-ops/factory-v1-1/bin/researchops.mjs"
            DIFF_BASE="$ANCHOR_FROZEN_SETUP_SHA"; APPROVED_BASE_SHA="$ANCHOR_APPROVED_BASE_SHA"
          fi
          # V3-C10 — NUL-delimited unquoted worker diff from the (frozen-setup or base)
          # boundary to the trusted head.
          git -c core.quotePath=false diff -z --name-status "$DIFF_BASE" "$HEAD_SHA" > changed-status.z
          echo "Worker changed (name-status, human view):"
          git --no-pager diff --name-status "$DIFF_BASE" "$HEAD_SHA" || true
          { echo "ENFORCE_BIN=$ENFORCE_BIN"; echo "DIFF_BASE=$DIFF_BASE"; echo "APPROVED_BASE_SHA=$APPROVED_BASE_SHA"; } >> "$GITHUB_ENV"

      - name: Enforce append-only boundary from the trusted enforcement root (fail-closed)
        run: |
          set -euo pipefail
          node "$ENFORCE_BIN" check-boundary \
            --changed-status-z changed-status.z \
            --emit-task-roots task-roots.txt \
            --head-branch "$HEAD_BRANCH" \
            --base-branch "$BASE_BRANCH" \
            --base-sha "$DIFF_BASE" \
            --head-sha "$HEAD_SHA" \
            --approved-base-sha "$APPROVED_BASE_SHA" \
            --checked-out-head "$(git rev-parse HEAD)" \
            --workspace "$GITHUB_WORKSPACE" \
            --repo-root "$GITHUB_WORKSPACE"

      - name: Validate discovered task roots (fail-closed)
        run: |
          set -euo pipefail
          if [ -s task-roots.txt ]; then
            while IFS= read -r t; do
              [ -n "$t" ] || continue
              # C4 — a referenced-but-absent root fails the job.
              [ -d "$t" ] || { echo "task root missing: $t"; exit 1; }
              echo "::group::validate $t"
              node research-ops/factory-v1-1/bin/researchops.mjs validate --task-dir "$t"
              echo "::endgroup::"
            done < task-roots.txt
          else
            echo "Factory-governance PR: no research-task root to validate."
          fi

      - name: Step summary
        if: always()
        run: |
          {
            echo "# ResearchOps Factory validation"
            echo ""
            echo "- Node: 20"
            echo "- Fixtures: executed via \`node research-ops/factory-v1-1/fixtures/run.mjs\`"
            echo "- Boundary: enforced via \`researchops check-boundary\` (fail-closed)"
            echo "- Permissions: contents:read (read-only)"
            echo "- Merges/deploys/AI calls/master mutation: none"
          } >> "$GITHUB_STEP_SUMMARY"
