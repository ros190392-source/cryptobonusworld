name: CBW Remaining Page Families v2 052I full review

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [master]

permissions:
  contents: read

jobs:
  browser-review:
    if: github.event.pull_request.head.ref == 'qa/cbw-remaining-page-families-v2-052i-full'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/cbw-preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4321/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/cbw-preview.log
          exit 1
      - name: Validate all remaining page families
        run: |
          mkdir -p qa-artifacts
          cat > .qa-remaining-page-families-full.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';

          const routes = [
            { name: 'exchanges', path: '/exchanges/', kind: 'directory' },
            { name: 'promo-codes', path: '/promo-codes/', kind: 'promo' },
            { name: 'methodology', path: '/methodology/', kind: 'methodology' },
            { name: 'editorial-policy', path: '/editorial-policy/', kind: 'info' },
            { name: 'update-policy', path: '/update-policy/', kind: 'info' },
            { name: 'about', path: '/about/', kind: 'info' },
            { name: 'faq', path: '/faq/', kind: 'faq' },
            { name: 'affiliate-disclosure', path: '/affiliate-disclosure/', kind: 'affiliate-legal' },
            { name: 'disclaimer', path: '/disclaimer/', kind: 'info' },
            { name: 'privacy-policy', path: '/privacy-policy/', kind: 'info' },
            { name: 'terms', path: '/terms/', kind: 'info' },
            { name: 'contact', path: '/contact/', kind: 'contact' },
          ];
          const viewports = [
            { name: 'desktop-1440', width: 1440, height: 1000 },
            { name: 'tablet-768', width: 768, height: 1024 },
            { name: 'mobile-390', width: 390, height: 844 },
          ];

          const results = [];
          let failed = false;
          const browser = await chromium.launch({ headless: true });

          try {
            for (const route of routes) {
              for (const viewport of viewports) {
                const page = await browser.newPage({ viewport });
                const consoleErrors = [];
                const pageErrors = [];
                const httpFailures = [];
                page.on('console', message => {
                  if (message.type() === 'error') consoleErrors.push(message.text());
                });
                page.on('pageerror', error => pageErrors.push(error.message));
                page.on('response', response => {
                  if (response.status() >= 400) httpFailures.push({ status: response.status(), url: response.url() });
                });

                const response = await page.goto(`http://127.0.0.1:4321${route.path}`, { waitUntil: 'networkidle' });
                const dimensions = await page.evaluate(() => ({
                  scrollWidth: document.documentElement.scrollWidth,
                  clientWidth: document.documentElement.clientWidth,
                  bodyScrollWidth: document.body.scrollWidth,
                }));
                const checks = {
                  http200: response?.status() === 200,
                  oneHeader: await page.locator('.site-header').count() === 1,
                  oneFooter: await page.locator('.site-footer').count() === 1,
                  noLegacyFinderLinks: await page.locator('a[href="/#finder"]').count() === 0,
                  noOverflow: dimensions.scrollWidth <= dimensions.clientWidth + 1 && dimensions.bodyScrollWidth <= dimensions.clientWidth + 1,
                  noConsoleErrors: consoleErrors.length === 0,
                  noPageErrors: pageErrors.length === 0,
                  noHttpFailures: httpFailures.length === 0,
                };

                if (route.kind === 'directory') {
                  const hero = page.locator('.page-hero');
                  const cards = page.locator('.ec');
                  checks.heroPresent = await hero.count() === 1;
                  checks.sixCards = await cards.count() === 6;
                  checks.sixAffiliateCtas = await page.locator('.ec-cta[href^="/go/"]').count() === 6;
                  checks.cardRadius = await cards.first().evaluate(el => parseFloat(getComputedStyle(el).borderRadius)) >= 16;
                  checks.cardActionsAmber = await page.locator('.ec-cta').first().evaluate(el => getComputedStyle(el).backgroundColor) === 'rgb(247, 147, 26)';
                  checks.sixFaqs = await page.locator('.exd-faq-item').count() === 6;
                }

                if (route.kind === 'promo') {
                  const link = page.locator('.pc-country-link');
                  checks.heroPresent = await page.locator('.page-hero').count() === 1;
                  checks.sixRows = await page.locator('[data-pc-row]').count() === 6;
                  checks.sixClaimPaths = await page.locator('.pc-claim-btn[href^="/go/"]').count() === 6;
                  checks.claimActionsAmber = await page.locator('.pc-claim-btn').first().evaluate(el => getComputedStyle(el).backgroundColor) === 'rgb(247, 147, 26)';
                  checks.linkTextNormalized = (await link.textContent())?.trim() === 'Compare the Top 10 →';
                  checks.linkHrefNormalized = await link.getAttribute('href') === '/#exchanges';
                  checks.eightFaqs = await page.locator('.pc-faq-item').count() === 8;
                }

                if (route.kind === 'methodology') {
                  checks.heroPresent = await page.locator('.page-hero').count() === 1;
                  checks.sixSteps = await page.locator('.mth-step').count() === 6;
                  checks.sixCriteria = await page.locator('.mth-criterion').count() === 6;
                  checks.stepRadius = await page.locator('.mth-step').first().evaluate(el => parseFloat(getComputedStyle(el).borderRadius)) >= 14;
                  const heading = page.locator('.mth-section-head h2').first();
                  checks.headingBarlow = await heading.evaluate(el => getComputedStyle(el).fontFamily.includes('Barlow Condensed'));
                  checks.headingNavy = await heading.evaluate(el => getComputedStyle(el).color === 'rgb(19, 35, 62)');
                }

                if (route.kind === 'info' || route.kind === 'affiliate-legal' || route.kind === 'contact') {
                  checks.infoPage = await page.locator('.info-page').count() === 1;
                  const heading = page.locator('.page-header h1, .ad-h1').first();
                  checks.headingPresent = await heading.count() === 1;
                  checks.headingBarlow = await heading.evaluate(el => getComputedStyle(el).fontFamily.includes('Barlow Condensed'));
                  checks.headingNavy = await heading.evaluate(el => getComputedStyle(el).color === 'rgb(19, 35, 62)');
                  checks.contentSurface = await page.locator('.prose, .ad-prose, .contact-grid').count() >= 1;
                }

                if (route.kind === 'affiliate-legal') {
                  checks.twoCallouts = await page.locator('.ad-callout').count() === 2;
                  checks.proseRadius = await page.locator('.ad-prose').evaluate(el => parseFloat(getComputedStyle(el).borderRadius)) >= 15;
                }

                if (route.kind === 'contact') {
                  checks.contactGrid = await page.locator('.contact-grid').count() === 1;
                  checks.contactFields = await page.locator('.contact-form input, .contact-form select, .contact-form textarea').count() >= 4;
                  checks.submitPresent = await page.locator('.form-submit').count() === 1;
                  checks.submitAmber = await page.locator('.form-submit').evaluate(el => getComputedStyle(el).backgroundColor) === 'rgb(247, 147, 26)';
                }

                if (route.kind === 'faq') {
                  checks.faqHero = await page.locator('.faq-intro').count() === 1;
                  const heading = page.locator('.faq-h1');
                  checks.headingBarlow = await heading.evaluate(el => getComputedStyle(el).fontFamily.includes('Barlow Condensed'));
                  checks.headingWhite = await heading.evaluate(el => getComputedStyle(el).color === 'rgb(255, 255, 255)');
                  checks.fiveGroups = await page.locator('.faq-group').count() === 5;
                  checks.twentyItems = await page.locator('.faq-item').count() === 20;
                  checks.groupRadius = await page.locator('.faq-group').first().evaluate(el => parseFloat(getComputedStyle(el).borderRadius)) >= 15;
                  checks.schemaPresent = await page.locator('script[type="application/ld+json"]').count() >= 1;
                  checks.legacyCopyRemoved = (await page.locator('.faq-foot').textContent())?.includes('compare the Top 10') === true;
                }

                const ok = Object.values(checks).every(Boolean);
                failed ||= !ok;
                const result = { route, viewport, ok, checks, dimensions, consoleErrors, pageErrors, httpFailures };
                results.push(result);
                console.log(JSON.stringify(result, null, 2));
                await page.screenshot({ path: `qa-artifacts/${route.name}-${viewport.name}.png`, fullPage: true });
                await page.close();
              }
            }
          } finally {
            await browser.close();
          }

          await writeFile('qa-artifacts/cbw-remaining-page-families-v2-052i-full.json', JSON.stringify({ failed, results }, null, 2));
          if (failed) process.exit(1);
          EOF
          node .qa-remaining-page-families-full.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbw-remaining-page-families-v2-052i-full
          path: qa-artifacts/
          if-no-files-found: error
